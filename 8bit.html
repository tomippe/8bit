<!DOCTYPE html>
<html lang="ja">
<head>
  <meta name="app-version" content="1.0.14">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>8BIT COIN HUNTER</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      text-shadow: none;
      box-shadow: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      color: white;
      font-family: "DotGothic16", monospace;
    }

    .game-container {
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      letter-spacing: 0;
      line-height: 1.2;
      text-shadow: none;
    }

    canvas {
      display: block;
      width: 640px;
      max-width: 95vw;
      height: auto;
      border: 6px solid white;
      background: black;

      /* ドット絵をくっきり表示 */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .info {
      margin-top: 10px;
      font-size: 16px;
      line-height: 1.6;
    }

    button {
      padding: 10px 20px;
      margin: 8px 4px 0;
      border: 4px solid white;
      background: #222;
      color: white;
      font-family: "DotGothic16", monospace;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: white;
      color: black;
    }

    #clearDataButton:hover {
      background: #e53935;
      border-color: #e53935;
      color: white;
    }

    .account-bar {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 100;
      text-align: right;
      max-width: min(280px, calc(100vw - 24px));
    }

    .account-bar button {
      margin: 0 0 0 6px;
      padding: 8px 12px;
      font-size: 13px;
    }

    .account-bar button:first-child {
      margin-left: 0;
    }

    #logoutButton,
    #deleteAccountButton {
      display: none;
    }

    #authPanel {
      display: none;
      margin-top: 8px;
      padding: 12px;
      border: 4px solid white;
      background: #111;
      text-align: left;
    }

    #authPanel.open {
      display: block;
    }

    #authPanel input {
      display: block;
      width: 100%;
      padding: 8px 10px;
      margin: 0 0 8px;
      border: 3px solid white;
      background: #000;
      color: white;
      font-family: "DotGothic16", monospace;
      font-size: 14px;
    }

    #authPanel .auth-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    #authPanel .auth-actions button {
      margin: 0;
      width: 100%;
    }

    #registerButton {
      display: none;
    }

    #authPanel.open #registerButton {
      display: block;
    }

    .account-status {
      margin-top: 8px;
      font-size: 12px;
      color: #aaa;
      min-height: 1.2em;
      text-align: right;
    }

    .account-status.ok {
      color: #7ef9ff;
    }

    .account-status.error {
      color: #ff706b;
    }

    #deleteAccountButton:hover {
      background: #e53935;
      border-color: #e53935;
      color: white;
    }

    .history-panel {
      display: none;
      margin-top: 20px;
      max-width: 640px;
      width: 95vw;
      text-align: left;
      border-top: 2px solid #444;
      padding-top: 12px;
    }

    .history-panel.visible {
      display: block;
    }

    .history-panel h2 {
      margin: 0 0 10px;
      font-size: 16px;
      letter-spacing: 1px;
    }

    .history-list {
      max-height: 280px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid #333;
      font-size: 12px;
      line-height: 1.5;
    }

    .history-item-body {
      flex: 1;
      min-width: 0;
    }

    .history-item-meta {
      color: #aaa;
    }

    .history-delete {
      margin: 0;
      padding: 2px 8px;
      font-size: 14px;
      line-height: 1;
      border-width: 2px;
      flex-shrink: 0;
    }

    .history-delete:hover {
      background: #e53935;
      border-color: #e53935;
      color: white;
    }

    .history-empty {
      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="account-bar">
  <button id="accountToggleButton" type="button">ログイン</button>
  <button id="logoutButton" type="button">ログアウト</button>
  <button id="deleteAccountButton" type="button">アカウント削除</button>

  <div id="authPanel">
    <input id="usernameInput" type="text" placeholder="ユーザー名" autocomplete="username">
    <input id="passwordInput" type="password" placeholder="パスワード" autocomplete="current-password">
    <div class="auth-actions">
      <button id="loginSubmitButton" type="button">ログイン</button>
      <button id="registerButton" type="button">新規登録</button>
    </div>
  </div>

  <div id="accountStatus" class="account-status"></div>
</div>

<div class="game-container">
  <h1>8BIT COIN HUNTER</h1>

  <canvas id="gameCanvas" width="320" height="240"></canvas>

  <div class="info">
    1P：矢印キー　2P：WASD　P：ポーズ　スペース：再スタート<br>
    黄色いコインを集めろ！赤い敵には触れるな！<br>
    コイン10個に1回くらい出る水色の星を取ると10秒間無敵！
  </div>

  <button id="restartButton">RESTART</button>
  <button id="twoPlayerButton">2P</button>
  <button id="clearDataButton">データ削除</button>

  <div id="historyPanel" class="history-panel">
    <h2>履歴</h2>
    <div id="historyList" class="history-list">
      <div class="history-empty">ログインすると履歴が残ります</div>
    </div>
  </div>
</div>

<script>
  "use strict";

  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  const restartButton = document.getElementById("restartButton");
  const twoPlayerButton = document.getElementById("twoPlayerButton");
  const clearDataButton = document.getElementById("clearDataButton");
  const accountToggleButton = document.getElementById("accountToggleButton");
  const usernameInput = document.getElementById("usernameInput");
  const passwordInput = document.getElementById("passwordInput");
  const loginSubmitButton = document.getElementById("loginSubmitButton");
  const registerButton = document.getElementById("registerButton");
  const logoutButton = document.getElementById("logoutButton");
  const deleteAccountButton = document.getElementById("deleteAccountButton");
  const authPanel = document.getElementById("authPanel");
  const accountStatus = document.getElementById("accountStatus");
  const historyPanel = document.getElementById("historyPanel");
  const historyList = document.getElementById("historyList");

  const WIDTH = canvas.width;
  const HEIGHT = canvas.height;

  const TILE_SIZE = 8;
  const SCORE_BAR_HEIGHT = 14;
  const HIGH_SCORE_KEY = "coinHunterHighScore";
  const HIGH_SCORE_2P_KEY = "coinHunterHighScore2P";
  const API_BASE = "api";

  const keys = {};

  let score = 0;
  let score2 = 0;
  let highScore1P = Number(localStorage.getItem(HIGH_SCORE_KEY)) || 0;
  let highScore2P = Number(localStorage.getItem(HIGH_SCORE_2P_KEY)) || 0;
  let highScore = highScore1P;
  let highScoreAtStart = highScore;
  let gameOver = false;
  let historyRecorded = false;
  let confirmingClearData = false;
  let paused = false;
  let animationId = null;
  let lastFrameTime = performance.now();
  let invincibleRemainingMs = 0;
  let invincibleRemainingMs2 = 0;
  let starCooldownCoins = 0;
  let runTimeMs = 0;
  let runStartedAt = Date.now();
  let runEndedAt = 0;
  let twoPlayerMode = false;
  let loggedInUsername = null;
  let authPanelOpen = false;
  let playHistory = [];

  const INVINCIBLE_DURATION_MS = 10000;
  const INVINCIBLE_ITEM_CHANCE = 0.1;
  const INVINCIBLE_ITEM_LIFETIME_MS = 5000;
  const STAR_COOLDOWN_COINS = 3;

  const clearConfirmButtons = {
    yes: { x: 70, y: 140, width: 70, height: 24 },
    no: { x: 180, y: 140, width: 70, height: 24 }
  };

  /*
   * プレイヤー
   */
  const player = {
    x: 40,
    y: 120,
    width: 16,
    height: 16,
    speed: 2,
    vx: 0,
    vy: 0,
    label: "P1",
    colors: {
      body: "#2398ff",
      light: "#70c8ff",
      feet: "#075da8",
      invBody: "#7ef9ff",
      invLight: "#ffffff",
      invFeet: "#2bb8c8"
    }
  };

  const player2 = {
    x: 264,
    y: 120,
    width: 16,
    height: 16,
    speed: 2,
    vx: 0,
    vy: 0,
    label: "P2",
    colors: {
      body: "#43a047",
      light: "#81c784",
      feet: "#1b5e20",
      invBody: "#b9f6ca",
      invLight: "#ffffff",
      invFeet: "#00c853"
    }
  };

  /*
   * コイン
   */
  const coin = {
    x: 200,
    y: 100,
    width: 8,
    height: 8
  };

  /*
   * 無敵アイテム
   */
  const invincibleItem = {
    x: 0,
    y: 0,
    width: 10,
    height: 10,
    active: false,
    remainingMs: 0
  };

  /*
   * 敵
   */
  let enemies = [];

  /*
   * キーボード操作
   */
  window.addEventListener("keydown", (event) => {
    keys[event.key] = true;

    const preventKeys = [
      "ArrowUp",
      "ArrowDown",
      "ArrowLeft",
      "ArrowRight",
      " "
    ];

    if (preventKeys.includes(event.key)) {
      event.preventDefault();
    }

    if (event.key === " " && gameOver && !confirmingClearData) {
      restartGame();
    }

    if (
      (event.key === "p" || event.key === "P") &&
      !gameOver &&
      !confirmingClearData
    ) {
      paused = !paused;

      if (paused) {
        keys.ArrowUp = false;
        keys.ArrowDown = false;
        keys.ArrowLeft = false;
        keys.ArrowRight = false;
        keys.w = false;
        keys.a = false;
        keys.s = false;
        keys.d = false;
        keys.W = false;
        keys.A = false;
        keys.S = false;
        keys.D = false;
      }
    }

    if (confirmingClearData) {
      if (event.key === "y" || event.key === "Y") {
        executeClearSavedData();
      }

      if (event.key === "n" || event.key === "N" || event.key === "Escape") {
        confirmingClearData = false;
      }
    }
  });

  window.addEventListener("keyup", (event) => {
    keys[event.key] = false;
  });

  restartButton.addEventListener("click", () => {
    if (confirmingClearData) {
      return;
    }

    restartGame();
  });

  twoPlayerButton.addEventListener("click", () => {
    if (confirmingClearData) {
      return;
    }

    twoPlayerMode = !twoPlayerMode;
    twoPlayerButton.textContent = twoPlayerMode ? "1P" : "2P";
    refreshHighScoreForMode();
    restartGame();
  });

  clearDataButton.addEventListener("click", () => {
    confirmingClearData = true;
  });

  canvas.addEventListener("click", (event) => {
    if (!confirmingClearData) {
      return;
    }

    const rect = canvas.getBoundingClientRect();
    const scaleX = WIDTH / rect.width;
    const scaleY = HEIGHT / rect.height;
    const x = (event.clientX - rect.left) * scaleX;
    const y = (event.clientY - rect.top) * scaleY;

    if (hitClearConfirmButton(clearConfirmButtons.yes, x, y)) {
      executeClearSavedData();
      return;
    }

    if (hitClearConfirmButton(clearConfirmButtons.no, x, y)) {
      confirmingClearData = false;
    }
  });

  function hitClearConfirmButton(button, x, y) {
    return (
      x >= button.x &&
      x <= button.x + button.width &&
      y >= button.y &&
      y <= button.y + button.height
    );
  }

  /*
   * 敵を作る
   */
  function createEnemy() {
    const size = 16;
    const minDistance = 80;
    let x = 0;
    let y = 0;
    let attempts = 0;

    do {
      x = randomGridPosition(WIDTH - size);
      y = randomGridPosition(HEIGHT - size);
      attempts++;
    } while (
      attempts < 100 &&
      (isTooClose(x, y, player.x, player.y, minDistance) ||
        (twoPlayerMode &&
          isTooClose(x, y, player2.x, player2.y, minDistance)) ||
        enemies.some((enemy) =>
          isTooClose(x, y, enemy.x, enemy.y, minDistance)
        ))
    );

    const enemy = {
      x,
      y,
      width: size,
      height: size,
      speed: 0.5 + Math.random() * 0.8 + totalScore() * 0.02,
      speedX: 0,
      speedY: 0
    };

    setEnemyDirection(enemy);
    enemies.push(enemy);
  }

  function isTooClose(x1, y1, x2, y2, minDistance) {
    return (
      Math.abs(x1 - x2) < minDistance &&
      Math.abs(y1 - y2) < minDistance
    );
  }

  /*
   * 横・縦・斜めどれかの方向をセット
   */
  function setEnemyDirection(enemy, blocked = {}) {
    const directions = [
      { x: -1, y: 0 },
      { x: 1, y: 0 },
      { x: 0, y: -1 },
      { x: 0, y: 1 },
      { x: -1, y: -1 },
      { x: 1, y: -1 },
      { x: -1, y: 1 },
      { x: 1, y: 1 }
    ].filter((direction) => {
      if (blocked.left && direction.x < 0) {
        return false;
      }

      if (blocked.right && direction.x > 0) {
        return false;
      }

      if (blocked.top && direction.y < 0) {
        return false;
      }

      if (blocked.bottom && direction.y > 0) {
        return false;
      }

      return true;
    });

    const direction =
      directions[Math.floor(Math.random() * directions.length)];

    enemy.speedX = direction.x * enemy.speed;
    enemy.speedY = direction.y * enemy.speed;
  }

  /*
   * 8ピクセル単位のランダム位置
   */
  function randomGridPosition(maximum) {
    const tiles = Math.floor(maximum / TILE_SIZE);
    return Math.floor(Math.random() * tiles) * TILE_SIZE;
  }

  /*
   * コインを別の場所へ移動
   */
  function moveCoin() {
    let validPosition = false;

    while (!validPosition) {
      coin.x = randomGridPosition(WIDTH - coin.width);
      /*
       * スコア表示の下から置く
       */
      coin.y =
        SCORE_BAR_HEIGHT +
        randomGridPosition(HEIGHT - SCORE_BAR_HEIGHT - coin.height);

      validPosition =
        !enemies.some((enemy) => checkCollision(coin, enemy)) &&
        !(
          invincibleItem.active &&
          checkCollision(coin, invincibleItem)
        );
    }
  }

  /*
   * 無敵アイテムを出現させる
   */
  function spawnInvincibleItem() {
    let validPosition = false;

    while (!validPosition) {
      invincibleItem.x = randomGridPosition(WIDTH - invincibleItem.width);
      invincibleItem.y =
        SCORE_BAR_HEIGHT +
        randomGridPosition(
          HEIGHT - SCORE_BAR_HEIGHT - invincibleItem.height
        );

      validPosition =
        !checkCollision(invincibleItem, coin) &&
        !checkCollision(invincibleItem, player) &&
        !(twoPlayerMode && checkCollision(invincibleItem, player2)) &&
        !enemies.some((enemy) => checkCollision(invincibleItem, enemy));
    }

    invincibleItem.active = true;
    invincibleItem.remainingMs = INVINCIBLE_ITEM_LIFETIME_MS;
  }

  function getActivePlayers() {
    return twoPlayerMode ? [player, player2] : [player];
  }

  function getPlayerInvincibleMs(target) {
    return target === player2
      ? invincibleRemainingMs2
      : invincibleRemainingMs;
  }

  function setPlayerInvincibleMs(target, value) {
    if (target === player2) {
      invincibleRemainingMs2 = value;
    } else {
      invincibleRemainingMs = value;
    }
  }

  /*
   * プレイヤーの移動
   */
  function updateOnePlayer(target, controls) {
    const previousX = target.x;
    const previousY = target.y;

    if (controls.left.some((key) => keys[key])) {
      target.x -= target.speed;
    }

    if (controls.right.some((key) => keys[key])) {
      target.x += target.speed;
    }

    if (controls.up.some((key) => keys[key])) {
      target.y -= target.speed;
    }

    if (controls.down.some((key) => keys[key])) {
      target.y += target.speed;
    }

    target.x = Math.max(
      0,
      Math.min(WIDTH - target.width, target.x)
    );

    target.y = Math.max(
      0,
      Math.min(HEIGHT - target.height, target.y)
    );

    target.vx = target.x - previousX;
    target.vy = target.y - previousY;
  }

  function updatePlayers() {
    updateOnePlayer(player, {
      left: ["ArrowLeft"],
      right: ["ArrowRight"],
      up: ["ArrowUp"],
      down: ["ArrowDown"]
    });

    if (twoPlayerMode) {
      updateOnePlayer(player2, {
        left: ["a", "A"],
        right: ["d", "D"],
        up: ["w", "W"],
        down: ["s", "S"]
      });
    }
  }

  /*
   * プレイヤーが敵に向かって突っ込んでいるか
   */
  function isPlayerChargingEnemy(target, enemy) {
    if (target.vx === 0 && target.vy === 0) {
      return false;
    }

    const playerCenterX = target.x + target.width / 2;
    const playerCenterY = target.y + target.height / 2;
    const enemyCenterX = enemy.x + enemy.width / 2;
    const enemyCenterY = enemy.y + enemy.height / 2;

    return (
      target.vx * (enemyCenterX - playerCenterX) +
        target.vy * (enemyCenterY - playerCenterY) >
      0
    );
  }

  /*
   * 敵の移動
   */
  function updateEnemies() {
    for (const enemy of enemies) {
      enemy.x += enemy.speedX;
      enemy.y += enemy.speedY;

      const hitLeft = enemy.x <= 0;
      const hitRight = enemy.x + enemy.width >= WIDTH;
      const hitTop = enemy.y <= 0;
      const hitBottom = enemy.y + enemy.height >= HEIGHT;

      if (hitLeft || hitRight || hitTop || hitBottom) {
        enemy.x = Math.max(
          0,
          Math.min(WIDTH - enemy.width, enemy.x)
        );
        enemy.y = Math.max(
          0,
          Math.min(HEIGHT - enemy.height, enemy.y)
        );

        setEnemyDirection(enemy, {
          left: hitLeft,
          right: hitRight,
          top: hitTop,
          bottom: hitBottom
        });
      }
    }
  }

  /*
   * 当たり判定
   */
  function checkCollision(objectA, objectB) {
    return (
      objectA.x < objectB.x + objectB.width &&
      objectA.x + objectA.width > objectB.x &&
      objectA.y < objectB.y + objectB.height &&
      objectA.y + objectA.height > objectB.y
    );
  }

  function totalScore() {
    return twoPlayerMode ? score + score2 : score;
  }

  function leadingScore() {
    return twoPlayerMode ? Math.max(score, score2) : score;
  }

  /*
   * コインと敵の当たり判定
   */
  function onCoinCollected(collector) {
    if (collector === player2) {
      score2++;
    } else {
      score++;
    }

    const best = leadingScore();

    if (best > highScore) {
      highScore = best;
      saveHighScore(highScore);
    }

    moveCoin();

    if (totalScore() % 3 === 0) {
      createEnemy();
    }

    if (
      !invincibleItem.active &&
      starCooldownCoins <= 0 &&
      Math.random() < INVINCIBLE_ITEM_CHANCE
    ) {
      spawnInvincibleItem();
    }

    if (starCooldownCoins > 0) {
      starCooldownCoins--;
    }
  }

  function checkGameCollisions() {
    const activePlayers = getActivePlayers();

    for (const target of activePlayers) {
      if (checkCollision(target, coin)) {
        onCoinCollected(target);
        break;
      }
    }

    if (invincibleItem.active) {
      for (const target of activePlayers) {
        if (checkCollision(target, invincibleItem)) {
          invincibleItem.active = false;
          invincibleItem.remainingMs = 0;
          setPlayerInvincibleMs(target, INVINCIBLE_DURATION_MS);
          starCooldownCoins = STAR_COOLDOWN_COINS;
          break;
        }
      }
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
      const enemy = enemies[i];
      let removed = false;

      for (const target of activePlayers) {
        if (!checkCollision(target, enemy)) {
          continue;
        }

        if (getPlayerInvincibleMs(target) > 0) {
          if (isPlayerChargingEnemy(target, enemy)) {
            enemies.splice(i, 1);
            removed = true;
            break;
          }
        } else {
          triggerGameOver();
          return;
        }
      }

      if (removed) {
        continue;
      }
    }
  }

  /*
   * 背景のドット模様
   */
  function drawBackground() {
    ctx.fillStyle = "#101820";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    ctx.fillStyle = "#182c38";

    for (let y = 0; y < HEIGHT; y += 16) {
      for (let x = 0; x < WIDTH; x += 16) {
        ctx.fillRect(x, y, 2, 2);
      }
    }
  }

  /*
   * プレイヤーを描く
   */
  function drawOnePlayer(target, invincibleMs) {
    const isInvincible = invincibleMs > 0;
    const flashOn =
      !isInvincible || Math.floor(performance.now() / 100) % 2 === 0;

    if (!flashOn) {
      ctx.globalAlpha = 0.35;
    }

    const colors = target.colors;

    ctx.fillStyle = isInvincible ? colors.invBody : colors.body;
    ctx.fillRect(target.x, target.y, 16, 16);

    ctx.fillStyle = isInvincible ? colors.invLight : colors.light;
    ctx.fillRect(target.x + 2, target.y + 2, 12, 4);

    ctx.fillStyle = "white";
    ctx.fillRect(target.x + 3, target.y + 6, 4, 4);
    ctx.fillRect(target.x + 9, target.y + 6, 4, 4);

    ctx.fillStyle = "black";
    ctx.fillRect(target.x + 5, target.y + 8, 2, 2);
    ctx.fillRect(target.x + 11, target.y + 8, 2, 2);

    ctx.fillStyle = isInvincible ? colors.invFeet : colors.feet;
    ctx.fillRect(target.x + 2, target.y + 14, 4, 2);
    ctx.fillRect(target.x + 10, target.y + 14, 4, 2);

    ctx.globalAlpha = 1;

    ctx.fillStyle = isInvincible ? colors.invBody : colors.light;
    ctx.font = '10px "DotGothic16", monospace';
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    ctx.fillText(
      isInvincible ? "INV" : target.label,
      target.x + target.width / 2,
      Math.max(SCORE_BAR_HEIGHT + 2, target.y - 1)
    );
    ctx.textAlign = "left";
  }

  function drawPlayers() {
    drawOnePlayer(player, invincibleRemainingMs);

    if (twoPlayerMode) {
      drawOnePlayer(player2, invincibleRemainingMs2);
    }
  }

  /*
   * コインを描く
   */
  function drawCoin() {
    ctx.fillStyle = "#ffcc00";
    ctx.fillRect(coin.x + 2, coin.y, 4, 8);
    ctx.fillRect(coin.x, coin.y + 2, 8, 4);

    ctx.fillStyle = "#fff17a";

  /*
   * 無敵アイテムを描く
   */
  function drawInvincibleItem() {
    if (!invincibleItem.active) {
      return;
    }

    const x = invincibleItem.x;
    const y = invincibleItem.y;
    const blink = Math.floor(performance.now() / 200) % 2 === 0;

    ctx.fillStyle = blink ? "#7ef9ff" : "#ffffff";
    ctx.fillRect(x + 4, y, 2, 10);
    ctx.fillRect(x, y + 4, 10, 2);
    ctx.fillRect(x + 2, y + 2, 6, 6);

    ctx.fillStyle = "#2bb8c8";
    ctx.fillRect(x + 4, y + 4, 2, 2);
  }

  /*
   * 敵を描く
   */
  function drawEnemies() {
    for (const enemy of enemies) {
      ctx.fillStyle = "#e53935";
      ctx.fillRect(enemy.x, enemy.y, 16, 16);

      ctx.fillStyle = "#ff706b";
      ctx.fillRect(enemy.x + 2, enemy.y + 2, 12, 4);

      /*
       * 怒った目
       */
      ctx.fillStyle = "white";
      ctx.fillRect(enemy.x + 3, enemy.y + 7, 4, 3);
      ctx.fillRect(enemy.x + 9, enemy.y + 7, 4, 3);

      ctx.fillStyle = "black";
      ctx.fillRect(enemy.x + 3, enemy.y + 7, 2, 2);
      ctx.fillRect(enemy.x + 11, enemy.y + 7, 2, 2);

      /*
       * 足
       */
      ctx.fillStyle = "#8a1010";
      ctx.fillRect(enemy.x + 1, enemy.y + 14, 5, 2);
      ctx.fillRect(enemy.x + 10, enemy.y + 14, 5, 2);
    }
  }

  function formatRunTime(ms) {
    const totalMs = Math.max(0, Math.floor(ms));
    const millis = String(totalMs % 1000).padStart(3, "0");
    const totalSeconds = Math.floor(totalMs / 1000);
    const seconds = totalSeconds % 60;
    const totalMinutes = Math.floor(totalSeconds / 60);
    const minutes = totalMinutes % 60;
    const hours = Math.floor(totalMinutes / 60);

    if (hours > 0) {
      return `${hours}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}.${millis}`;
    }

    if (totalMinutes > 0) {
      return `${totalMinutes}:${String(seconds).padStart(2, "0")}.${millis}`;
    }

    return `${seconds}.${millis}`;
  }

  function formatClockHm(timestamp) {
    const date = new Date(timestamp);
    const hours = String(date.getHours()).padStart(2, "0");
    const minutes = String(date.getMinutes()).padStart(2, "0");
    return `${hours}:${minutes}`;
  }

  function triggerGameOver() {
    if (gameOver) {
      return;
    }

    gameOver = true;
    runEndedAt = Date.now();
    recordPlayHistory();
  }

  /*
   * スコア表示
   */
  function drawScore() {
    ctx.font = '10px "DotGothic16", monospace';
    ctx.textBaseline = "middle";

    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, WIDTH, SCORE_BAR_HEIGHT);

    const textY = SCORE_BAR_HEIGHT / 2;
    const isHighScoreUpdating = leadingScore() > highScoreAtStart;
    const total = score + score2;

    ctx.fillStyle = "white";

    if (twoPlayerMode) {
      ctx.fillText(`SC ${score}`, 2, textY);
      ctx.fillStyle = "#81c784";
      ctx.fillText(`2PSC ${score2}`, 42, textY);
      ctx.fillStyle = "#ffcc00";
      ctx.fillText(`TOT ${total}`, 96, textY);
      ctx.fillStyle = "white";
      ctx.fillText(`E ${enemies.length}`, 140, textY);
      ctx.fillText(`T ${formatRunTime(runTimeMs)}`, 168, textY);
    } else {
      ctx.fillText(`SCORE ${score}`, 4, textY);
      ctx.fillText(`ENEMY ${enemies.length}`, 78, textY);
      ctx.fillText(`TIME ${formatRunTime(runTimeMs)}`, 145, textY);
    }

    if (invincibleRemainingMs > 0) {
      const seconds = Math.ceil(invincibleRemainingMs / 1000);
      ctx.fillStyle = "#7ef9ff";
      ctx.fillText(`P1 ${seconds}`, twoPlayerMode ? 225 : 230, textY);
    }

    if (twoPlayerMode && invincibleRemainingMs2 > 0) {
      const seconds = Math.ceil(invincibleRemainingMs2 / 1000);
      ctx.fillStyle = "#81c784";
      ctx.fillText(`P2 ${seconds}`, 258, textY);
    }

    const hiText = twoPlayerMode
      ? `HI2 ${highScore}`
      : `HI ${highScore}`;
    const hiWidth = ctx.measureText(hiText).width;
    let cursorX = WIDTH - 4;

    if (isHighScoreUpdating) {
      const message = "NEW!";
      const messageWidth = ctx.measureText(message).width;
      cursorX -= messageWidth;
      ctx.fillStyle = "#ffcc00";
      ctx.fillText(message, cursorX, textY);
      cursorX -= 4;
    }

    cursorX -= hiWidth;
    ctx.fillStyle = "white";
    ctx.fillText(hiText, cursorX, textY);
  }

  /*
   * ゲーム状態の更新
   */
  function update() {
    const now = performance.now();

    if (gameOver || confirmingClearData || paused) {
      lastFrameTime = now;
      return;
    }

    const deltaMs = Math.min(now - lastFrameTime, 100);
    lastFrameTime = now;
    runTimeMs += deltaMs;

    if (invincibleRemainingMs > 0) {
      invincibleRemainingMs = Math.max(
        0,
        invincibleRemainingMs - deltaMs
      );
    }

    if (invincibleRemainingMs2 > 0) {
      invincibleRemainingMs2 = Math.max(
        0,
        invincibleRemainingMs2 - deltaMs
      );
    }

    if (invincibleItem.active) {
      invincibleItem.remainingMs -= deltaMs;

      if (invincibleItem.remainingMs <= 0) {
        invincibleItem.active = false;
        invincibleItem.remainingMs = 0;
      }
    }

    updatePlayers();
    updateEnemies();
    checkGameCollisions();
  }

  /*
   * 描画
   */
  function draw() {
    drawBackground();
    drawCoin();
    drawInvincibleItem();
    drawEnemies();
    drawPlayers();
    drawScore();

    if (gameOver) {
      drawGameOver();
    }

    if (paused && !confirmingClearData) {
      drawPause();
    }

    if (confirmingClearData) {
      drawClearDataConfirm();
    }
  }

  /*
   * メインループ
   */
  function gameLoop() {
    update();
    draw();

    animationId = requestAnimationFrame(gameLoop);
  }

  /*
   * 最初からやり直す
   */
  function restartGame() {
    score = 0;
    score2 = 0;
    highScoreAtStart = highScore;
    gameOver = false;
    historyRecorded = false;
    confirmingClearData = false;
    paused = false;
    invincibleRemainingMs = 0;
    invincibleRemainingMs2 = 0;
    invincibleItem.active = false;
    invincibleItem.remainingMs = 0;
    starCooldownCoins = 0;
    runTimeMs = 0;
    runStartedAt = Date.now();
    runEndedAt = 0;
    lastFrameTime = performance.now();

    player.x = 40;
    player.y = 120;
    player.vx = 0;
    player.vy = 0;

    player2.x = 264;
    player2.y = 120;
    player2.vx = 0;
    player2.vy = 0;

    enemies = [];

    createEnemy();
    moveCoin();
  }

  /*
   * 保存データを削除
   */
  function executeClearSavedData() {
    localStorage.removeItem(HIGH_SCORE_KEY);
    localStorage.removeItem(HIGH_SCORE_2P_KEY);
    highScore1P = 0;
    highScore2P = 0;
    highScore = 0;
    highScoreAtStart = 0;
    score = 0;
    score2 = 0;
    confirmingClearData = false;

    if (loggedInUsername) {
      apiRequest("score.php", { method: "DELETE" })
        .then((data) => {
          if (!data.ok) {
            setAccountStatus(data.error || "削除に失敗しました", "error");
            return;
          }

          setAccountStatus("アカウントのハイスコアを削除しました", "ok");
        })
        .catch(() => {
          setAccountStatus("サーバーに接続できませんでした", "error");
        });
    }

    restartGame();
  }

  /*
   * アカウント / ハイスコア同期
   */
  function setAccountStatus(message, type) {
    accountStatus.textContent = message;
    accountStatus.className = "account-status";

    if (type) {
      accountStatus.classList.add(type);
    }
  }

  function setAuthPanelOpen(open) {
    authPanelOpen = open;

    if (open) {
      authPanel.classList.add("open");
    } else {
      authPanel.classList.remove("open");
    }
  }

  function updateAccountView() {
    if (loggedInUsername) {
      accountToggleButton.style.display = "none";
      logoutButton.style.display = "inline-block";
      deleteAccountButton.style.display = "inline-block";
      historyPanel.classList.add("visible");
      setAuthPanelOpen(false);
    } else {
      accountToggleButton.style.display = "inline-block";
      logoutButton.style.display = "none";
      deleteAccountButton.style.display = "none";
      historyPanel.classList.remove("visible");
      playHistory = [];
      renderHistoryList();
    }
  }

  function renderHistoryList() {
    if (!loggedInUsername) {
      historyList.innerHTML =
        '<div class="history-empty">ログインすると履歴が残ります</div>';
      return;
    }

    if (!playHistory.length) {
      historyList.innerHTML =
        '<div class="history-empty">まだ履歴がありません</div>';
      return;
    }

    historyList.innerHTML = playHistory
      .map((entry) => {
        const modeLabel = entry.mode === "2p" ? "2P" : "1P";
        const duration = formatRunTime(entry.durationMs || 0);
        const clock = `${formatClockHm(entry.startedAt)}〜${formatClockHm(entry.endedAt)}`;
        let scores = "";

        if (entry.mode === "2p") {
          scores =
            `SC ${entry.score} / 2PSC ${entry.score2} / TOTALSC ${entry.totalScore} / ` +
            `HI2 ${entry.highScore}`;
        } else {
          scores = `SCORE ${entry.score} / HI ${entry.highScore}`;
        }

        return `
          <div class="history-item" data-id="${entry.id}">
            <div class="history-item-body">
              <div>[${modeLabel}] ${scores}</div>
              <div class="history-item-meta">時間 ${duration}　${clock}</div>
            </div>
            <button type="button" class="history-delete" data-id="${entry.id}" aria-label="削除">×</button>
          </div>
        `;
      })
      .join("");
  }

  async function loadPlayHistory() {
    if (!loggedInUsername) {
      playHistory = [];
      renderHistoryList();
      return;
    }

    try {
      const data = await apiRequest("history.php", { method: "GET" });

      if (!data.ok) {
        setAccountStatus(data.error || "履歴の取得に失敗しました", "error");
        return;
      }

      playHistory = Array.isArray(data.history) ? data.history : [];
      renderHistoryList();
    } catch (error) {
      setAccountStatus("履歴の取得に失敗しました", "error");
    }
  }

  async function recordPlayHistory() {
    if (!loggedInUsername || historyRecorded) {
      return;
    }

    historyRecorded = true;

    const payload = {
      mode: twoPlayerMode ? "2p" : "1p",
      score,
      score2: twoPlayerMode ? score2 : 0,
      totalScore: twoPlayerMode ? score + score2 : score,
      highScore,
      durationMs: Math.floor(runTimeMs),
      startedAt: runStartedAt,
      endedAt: runEndedAt || Date.now()
    };

    try {
      const data = await apiRequest("history.php", {
        method: "POST",
        body: JSON.stringify(payload)
      });

      if (!data.ok) {
        historyRecorded = false;
        setAccountStatus(data.error || "履歴の保存に失敗しました", "error");
        return;
      }

      playHistory = Array.isArray(data.history) ? data.history : playHistory;
      renderHistoryList();
    } catch (error) {
      historyRecorded = false;
      setAccountStatus("履歴の保存に失敗しました", "error");
    }
  }

  async function deletePlayHistory(id) {
    if (!loggedInUsername || !id) {
      return;
    }

    try {
      const data = await apiRequest("history.php", {
        method: "DELETE",
        body: JSON.stringify({ id })
      });

      if (!data.ok) {
        setAccountStatus(data.error || "履歴の削除に失敗しました", "error");
        return;
      }

      playHistory = Array.isArray(data.history) ? data.history : [];
      renderHistoryList();
      setAccountStatus("履歴を削除しました", "ok");
    } catch (error) {
      setAccountStatus("履歴の削除に失敗しました", "error");
    }
  }

  async function apiRequest(path, options = {}) {
    const { headers: customHeaders, ...rest } = options;

    const response = await fetch(`${API_BASE}/${path}`, {
      credentials: "same-origin",
      ...rest,
      headers: {
        "Content-Type": "application/json",
        ...(customHeaders || {})
      }
    });

    let data = null;

    try {
      data = await response.json();
    } catch (error) {
      data = {
        ok: false,
        error: "サーバー応答を読めませんでした"
      };
    }

    if (!response.ok && data && !data.error) {
      data.error = `エラー (${response.status})`;
    }

    return data;
  }

  function refreshHighScoreForMode() {
    highScore = twoPlayerMode ? highScore2P : highScore1P;
    highScoreAtStart = highScore;
  }

  function applyHighScores(score1P, score2P, resetStart = false) {
    if (score1P !== undefined && score1P !== null) {
      highScore1P = Number(score1P) || 0;
      localStorage.setItem(HIGH_SCORE_KEY, String(highScore1P));
    }

    if (score2P !== undefined && score2P !== null) {
      highScore2P = Number(score2P) || 0;
      localStorage.setItem(HIGH_SCORE_2P_KEY, String(highScore2P));
    }

    highScore = twoPlayerMode ? highScore2P : highScore1P;

    if (resetStart || score === 0) {
      highScoreAtStart = highScore;
    }
  }

  async function syncHighScoreWithServer(preferred1P, preferred2P) {
    const local1P = Number(localStorage.getItem(HIGH_SCORE_KEY)) || 0;
    const local2P = Number(localStorage.getItem(HIGH_SCORE_2P_KEY)) || 0;
    const candidate1P = Math.max(
      local1P,
      Number(preferred1P) || 0
    );
    const candidate2P = Math.max(
      local2P,
      Number(preferred2P) || 0
    );

    const data = await apiRequest("score.php", {
      method: "POST",
      body: JSON.stringify({
        highScore: candidate1P,
        highScore2P: candidate2P
      })
    });

    if (!data.ok) {
      throw new Error(data.error || "同期に失敗しました");
    }

    applyHighScores(data.highScore, data.highScore2P, true);
    return data;
  }

  function saveHighScore(value) {
    if (twoPlayerMode) {
      highScore2P = value;
      localStorage.setItem(HIGH_SCORE_2P_KEY, String(value));
    } else {
      highScore1P = value;
      localStorage.setItem(HIGH_SCORE_KEY, String(value));
    }

    highScore = value;

    if (!loggedInUsername) {
      return;
    }

    const payload = twoPlayerMode
      ? { highScore2P: value }
      : { highScore: value };

    apiRequest("score.php", {
      method: "POST",
      body: JSON.stringify(payload)
    })
      .then((data) => {
        if (!data.ok) {
          setAccountStatus(data.error || "同期に失敗しました", "error");
          return;
        }

        applyHighScores(data.highScore, data.highScore2P, false);
      })
      .catch(() => {
        setAccountStatus("ハイスコアの同期に失敗しました", "error");
      });
  }

  async function handleAuth(action) {
    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    if (!username || !password) {
      setAccountStatus("ユーザー名とパスワードを入力してください", "error");
      return;
    }

    setAccountStatus("通信中...");

    try {
      const data = await apiRequest(`auth.php?action=${action}`, {
        method: "POST",
        body: JSON.stringify({ username, password })
      });

      if (!data.ok) {
        setAccountStatus(data.error || "失敗しました", "error");
        return;
      }

      loggedInUsername = data.username;
      passwordInput.value = "";
      setAuthPanelOpen(false);

      await syncHighScoreWithServer(data.highScore, data.highScore2P);
      updateAccountView();
      await loadPlayHistory();
      setAccountStatus(
        action === "register"
          ? "アカウントを作成してログインしました"
          : "ログインしました",
        "ok"
      );
    } catch (error) {
      setAccountStatus(
        error.message || "サーバーに接続できませんでした",
        "error"
      );
    }
  }

  async function handleLogout() {
    setAccountStatus("通信中...");

    try {
      const data = await apiRequest("auth.php?action=logout", {
        method: "POST",
        body: "{}"
      });

      if (!data.ok) {
        setAccountStatus(data.error || "ログアウトに失敗しました", "error");
        return;
      }

      loggedInUsername = null;
      playHistory = [];
      updateAccountView();
      setAccountStatus("ログアウトしました", "ok");
    } catch (error) {
      setAccountStatus("サーバーに接続できませんでした", "error");
    }
  }

  async function handleDeleteAccount() {
    if (!window.confirm("アカウントを削除しますか？ハイスコアも消えます。")) {
      return;
    }

    setAccountStatus("通信中...");

    try {
      const data = await apiRequest("auth.php?action=delete", {
        method: "POST",
        body: "{}"
      });

      if (!data.ok) {
        setAccountStatus(data.error || "アカウント削除に失敗しました", "error");
        return;
      }

      loggedInUsername = null;
      localStorage.removeItem(HIGH_SCORE_KEY);
      localStorage.removeItem(HIGH_SCORE_2P_KEY);
      highScore1P = 0;
      highScore2P = 0;
      highScore = 0;
      highScoreAtStart = 0;
      score = 0;
      score2 = 0;
      updateAccountView();
      setAccountStatus("アカウントを削除しました", "ok");
      restartGame();
    } catch (error) {
      setAccountStatus("サーバーに接続できませんでした", "error");
    }
  }

  async function restoreAccountSession() {
    updateAccountView();

    try {
      const data = await apiRequest("auth.php?action=me", {
        method: "GET"
      });

      if (!data.ok || !data.loggedIn) {
        loggedInUsername = null;
        updateAccountView();
        return;
      }

      loggedInUsername = data.username;
      await syncHighScoreWithServer(data.highScore, data.highScore2P);
      updateAccountView();
      await loadPlayHistory();
      setAccountStatus("アカウントのハイスコアを読み込みました", "ok");
    } catch (error) {
      loggedInUsername = null;
      updateAccountView();
    }
  }

    const button = event.target.closest(".history-delete");

    if (!button) {

    deletePlayHistory(button.getAttribute("data-id"));

    setAuthPanelOpen(!authPanelOpen);

    if (authPanelOpen) {
      usernameInput.focus();
    }
  });

  loginSubmitButton.addEventListener("click", () => {
    handleAuth("login");
  });

  registerButton.addEventListener("click", () => {
    handleAuth("register");
  });

  logoutButton.addEventListener("click", handleLogout);
  deleteAccountButton.addEventListener("click", handleDeleteAccount);

  passwordInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      handleAuth("login");
    }
  });

  /*
   * ゲーム開始
   */
  function startGame() {
    restartGame();
    gameLoop();
    restoreAccountSession();
  }

  if (document.fonts && document.fonts.load) {
    document.fonts
      .load('16px "DotGothic16"')
      .catch(() => null)
      .finally(startGame);
  } else {
    startGame();
  }
</script>

</body>
</html>
