<!DOCTYPE html>
<html lang="ja">
<head>
  <meta name="app-version" content="1.0.49">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>8BIT COIN HUNTER</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      text-shadow: none;
      box-shadow: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      touch-action: manipulation;
      color: white;
      font-family: "DotGothic16", monospace;
    }

    .game-container {
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      letter-spacing: 0;
      line-height: 1.2;
      text-shadow: none;
    }

    canvas {
      display: block;
      width: 640px;
      max-width: 95vw;
      height: auto;
      border: 6px solid white;
      background: black;

      /* ドット絵をくっきり表示 */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .info {
      margin-top: 10px;
      font-size: 16px;
      line-height: 1.6;
    }

    button {
      padding: 10px 20px;
      margin: 8px 4px 0;
      border: 4px solid white;
      background: #222;
      color: white;
      font-family: "DotGothic16", monospace;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: white;
      color: black;
    }

    #clearDataButton:hover {
      background: #e53935;
      border-color: #e53935;
      color: white;
    }

    .account-bar {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 100;
      text-align: right;
      max-width: min(280px, calc(100vw - 24px));
    }

    .account-bar button {
      margin: 0 0 0 6px;
      padding: 8px 12px;
      font-size: 13px;
    }

    .account-bar button:first-child {
      margin-left: 0;
    }

    #logoutButton,
    #deleteAccountButton {
      display: none;
    }

    #authPanel {
      display: none;
      margin-top: 8px;
      padding: 12px;
      border: 4px solid white;
      background: #111;
      text-align: left;
    }

    #authPanel.open {
      display: block;
    }

    #authPanel input {
      display: block;
      width: 100%;
      padding: 8px 10px;
      margin: 0 0 8px;
      border: 3px solid white;
      background: #000;
      color: white;
      font-family: "DotGothic16", monospace;
      font-size: 14px;
    }

    #authPanel .auth-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    #authPanel .auth-actions button {
      margin: 0;
      width: 100%;
    }

    #registerButton {
      display: none;
    }

    #authPanel.open #registerButton {
      display: block;
    }

    .account-status {
      margin-top: 8px;
      font-size: 12px;
      color: #aaa;
      min-height: 1.2em;
      text-align: right;
    }

    .account-status.ok {
      color: #7ef9ff;
    }

    .account-status.error {
      color: #ff706b;
    }

    #deleteAccountButton:hover {
      background: #e53935;
      border-color: #e53935;
      color: white;
    }

    .history-panel {
      display: none;
      margin-top: 20px;
      max-width: 640px;
      width: 95vw;
      text-align: left;
      border-top: 2px solid #444;
      padding-top: 12px;
    }

    .history-panel.visible {
      display: block;
    }

    .history-panel h2 {
      margin: 0 0 10px;
      font-size: 16px;
      letter-spacing: 1px;
    }

    .history-list {
      max-height: 280px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid #333;
      font-size: 12px;
      line-height: 1.5;
    }

    .history-item-body {
      flex: 1;
      min-width: 0;
    }

    .history-item-meta {
      color: #aaa;
    }

    .history-delete {
      margin: 0;
      padding: 2px 8px;
      font-size: 14px;
      line-height: 1;
      border-width: 2px;
      flex-shrink: 0;
    }

    .history-delete:hover {
      background: #e53935;
      border-color: #e53935;
      color: white;
    }

    .history-empty {
      color: #777;
      font-size: 12px;
    }

    .ranking-panel {
      margin-top: 20px;
      max-width: 640px;
      width: 95vw;
      text-align: left;
      border-top: 2px solid #444;
      padding-top: 12px;
    }

    .ranking-panel h2 {
      margin: 0 0 10px;
      font-size: 16px;
      letter-spacing: 1px;
    }

    .ranking-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .ranking-tabs button {
      margin: 0;
      padding: 6px 10px;
      font-size: 12px;
    }

    .ranking-tabs button.active {
      background: white;
      color: black;
    }

    .rank-list {
      max-height: 280px;
      overflow-y: auto;
    }

    .rank-item {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid #333;
      font-size: 12px;
      line-height: 1.5;
    }

    .rank-item.me {
      color: #7ef9ff;
    }

    .rank-pos {
      width: 2.2em;
      flex-shrink: 0;
      color: #aaa;
    }

    .rank-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rank-score {
      flex-shrink: 0;
      color: #ffcc00;
    }

    .ranking-meta {
      color: #777;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .settings-panel {
      margin-top: 16px;
      max-width: 640px;
      width: 95vw;
      text-align: left;
      border-top: 2px solid #444;
      padding-top: 12px;
    }

    .settings-panel h2 {
      margin: 0 0 10px;
      font-size: 16px;
      letter-spacing: 1px;
    }

    .settings-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .settings-row label {
      min-width: 110px;
      color: #aaa;
    }

    .settings-row button {
      margin: 0;
      padding: 6px 10px;
      font-size: 12px;
    }

    .settings-row button.active {
      background: white;
      color: black;
    }

    .settings-row.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .login-time {
      margin-top: 6px;
      font-size: 12px;
      color: #7ef9ff;
      display: none;
    }

    .login-time.visible {
      display: block;
    }

    .touch-controls {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 80;
      padding: 0 10px;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      gap: 12px;
      touch-action: none;
    }

    .touch-controls.visible {
      display: flex;
    }

    body.has-touch-controls {
      padding-bottom: 180px;
      align-items: flex-start;
      padding-top: 56px;
    }

    .touch-pad {
      pointer-events: auto;
      display: grid;
      grid-template-columns: 58px 58px 58px;
      grid-template-rows: 58px 58px 58px;
      gap: 6px;
      user-select: none;
      -webkit-user-select: none;
    }

    .touch-pad-wrap {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .touch-pad-wrap-p2 {
      display: none;
    }

    .touch-controls.two-player .touch-pad-wrap-p2 {
      display: flex;
    }

    .touch-pad-p2 {
      display: grid;
    }

    .touch-pad button {
      margin: 0;
      padding: 0;
      width: 58px;
      height: 58px;
      border-width: 3px;
      font-size: 20px;
      line-height: 1;
      background: rgba(34, 34, 34, 0.88);
      touch-action: none;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .touch-pad button:hover {
      background: rgba(34, 34, 34, 0.88);
      color: white;
    }

    .touch-pad button.active,
    .touch-pad button:active {
      background: white;
      color: black;
    }

    .touch-btn-up { grid-column: 2; grid-row: 1; }
    .touch-btn-left { grid-column: 1; grid-row: 2; }
    .touch-btn-right { grid-column: 3; grid-row: 2; }
    .touch-btn-down { grid-column: 2; grid-row: 3; }

    .touch-start-button {
      display: none;
      margin: 10px auto 0;
      padding: 12px 18px;
      font-size: 14px;
      background: rgba(34, 34, 34, 0.9);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    body.has-touch-controls .touch-start-button.visible {
      display: block;
    }

    .touch-start-button:active,
    .touch-start-button.active {
      background: white;
      color: black;
    }

    body.playing .account-bar,
    body.playing h1,
    body.playing .info,
    body.playing #restartButton,
    body.playing #twoPlayerButton,
    body.playing #clearDataButton,
    body.playing .history-panel,
    body.playing .ranking-panel,
    body.playing .settings-panel {
      display: none;
    }

    .touch-actions {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-self: flex-end;
    }

    .touch-actions button {
      margin: 0;
      min-width: 72px;
      padding: 14px 12px;
      font-size: 13px;
      background: rgba(34, 34, 34, 0.88);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .touch-actions button:hover {
      background: rgba(34, 34, 34, 0.88);
      color: white;
    }

    .touch-actions button:active,
    .touch-actions button.active {
      background: white;
      color: black;
    }

    .touch-pad-label {
      font-size: 11px;
      color: #aaa;
      pointer-events: none;
    }

    .touch-pad-label-p1 { color: #70c8ff; }
    .touch-pad-label-p2 { color: #ff9a70; }

    @media (max-width: 420px) {
      .touch-pad {
        grid-template-columns: 52px 52px 52px;
        grid-template-rows: 52px 52px 52px;
        gap: 5px;
      }

      .touch-pad button {
        width: 52px;
        height: 52px;
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<div class="account-bar">
  <button id="accountToggleButton" type="button">ログイン</button>
  <button id="logoutButton" type="button">ログアウト</button>
  <button id="deleteAccountButton" type="button">アカウント削除</button>

  <div id="authPanel">
    <input id="usernameInput" type="text" placeholder="ユーザー名" autocomplete="username">
    <input id="passwordInput" type="password" placeholder="パスワード" autocomplete="current-password">
    <div class="auth-actions">
      <button id="loginSubmitButton" type="button">ログイン</button>
      <button id="registerButton" type="button">新規登録</button>
    </div>
  </div>

  <div id="loginTimeLabel" class="login-time"></div>
  <div id="accountStatus" class="account-status"></div>
</div>

<div class="game-container">
  <h1>8BIT COIN HUNTER</h1>

  <canvas id="gameCanvas" width="320" height="240"></canvas>

  <div class="info">
    1P：矢印キー　2P：WASD　P：ポーズ　スペース：再スタート<br>
    黄色いコインを集めろ！赤い敵には触れるな！<br>
    水色の星＝10秒無敵　緑のハート＝ライフ回復（減っているとき出現）
  </div>

  <button id="restartButton">RESTART</button>
  <button id="twoPlayerButton">2P</button>
  <button id="clearDataButton">データ削除</button>

  <div id="touchControls" class="touch-controls" aria-hidden="true">
    <div class="touch-pad-wrap">
      <span class="touch-pad-label touch-pad-label-p1">1P</span>
      <div class="touch-pad touch-pad-p1" aria-label="1P操作">
        <button type="button" class="touch-btn-up" data-keys="ArrowUp">▲</button>
        <button type="button" class="touch-btn-left" data-keys="ArrowLeft">◀</button>
        <button type="button" class="touch-btn-right" data-keys="ArrowRight">▶</button>
        <button type="button" class="touch-btn-down" data-keys="ArrowDown">▼</button>
      </div>
    </div>

    <div class="touch-actions">
      <button type="button" id="touchPauseButton">PAUSE</button>
    </div>

    <div class="touch-pad-wrap touch-pad-wrap-p2">
      <span class="touch-pad-label touch-pad-label-p2">2P</span>
      <div class="touch-pad touch-pad-p2" aria-label="2P操作">
        <button type="button" class="touch-btn-up" data-keys="w,W">▲</button>
        <button type="button" class="touch-btn-left" data-keys="a,A">◀</button>
        <button type="button" class="touch-btn-right" data-keys="d,D">▶</button>
        <button type="button" class="touch-btn-down" data-keys="s,S">▼</button>
      </div>
    </div>
  </div>

  <button type="button" id="touchStartButton" class="touch-start-button">
    TAP TO START
  </button>

  <div id="historyPanel" class="history-panel">
    <h2>履歴</h2>
    <div id="historyList" class="history-list">
      <div class="history-empty">ログインすると履歴が残ります</div>
    </div>
  </div>

  <div class="ranking-panel">
    <h2>世界ランキング</h2>
    <div class="ranking-meta" id="worldRankingMeta">自動更新中</div>
    <div class="ranking-tabs">
      <button type="button" id="rankingTypeHighButton" class="active">ハイスコア</button>
      <button type="button" id="rankingTypeCoinsButton">コイン獲得数</button>
    </div>
    <div class="ranking-tabs" id="rankingHighSubTabs">
      <button type="button" id="ranking1PButton" class="active">1P HI</button>
      <button type="button" id="ranking2PButton">2P HI</button>
    </div>
    <div id="worldRankingList" class="rank-list">
      <div class="history-empty">読み込み中...</div>
    </div>
  </div>

  <div class="settings-panel">
    <h2>設定</h2>
    <div class="settings-row">
      <label>難易度</label>
      <button type="button" id="difficultyEasyButton">EASY</button>
      <button type="button" id="difficultyNormalButton">NORMAL</button>
      <button type="button" id="difficultyHardButton">HARD</button>
    </div>
    <div class="settings-row">
      <label>2Pモード</label>
      <button type="button" id="modeCoopButton">協力</button>
      <button type="button" id="modeVersusButton">対戦</button>
      <button type="button" id="modeVersus2Button">対戦2</button>
      <button type="button" id="modeHardCoopButton">HARD協力</button>
    </div>
    <div class="settings-row">
      <label>時刻表記</label>
      <button type="button" id="timeFormat24Button">24時間</button>
      <button type="button" id="timeFormat12Button">12時間</button>
    </div>
    <div class="settings-row" id="ampmSettingsRow">
      <label>AM/PM表示</label>
      <button type="button" id="ampmOnButton">する</button>
      <button type="button" id="ampmOffButton">しない</button>
    </div>
    <div class="settings-row">
      <label>効果音</label>
      <button type="button" id="soundOnButton">ON</button>
      <button type="button" id="soundOffButton">OFF</button>
    </div>
    <div class="settings-row">
      <label>BGM</label>
      <button type="button" id="bgmOnButton">ON</button>
      <button type="button" id="bgmOffButton">OFF</button>
    </div>
    <div class="settings-row">
      <label>履歴登録</label>
      <button type="button" id="historyOnButton">する</button>
      <button type="button" id="historyOffButton">しない</button>
    </div>
    <div class="settings-row">
      <label>ランキング掲載</label>
      <button type="button" id="rankingOnButton">する</button>
      <button type="button" id="rankingOffButton">しない</button>
    </div>
  </div>
</div>

<script>
  "use strict";

  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  const restartButton = document.getElementById("restartButton");
  const twoPlayerButton = document.getElementById("twoPlayerButton");
  const clearDataButton = document.getElementById("clearDataButton");
  const touchControls = document.getElementById("touchControls");
  const touchPauseButton = document.getElementById("touchPauseButton");
  const touchStartButton = document.getElementById("touchStartButton");
  const accountToggleButton = document.getElementById("accountToggleButton");
  const usernameInput = document.getElementById("usernameInput");
  const passwordInput = document.getElementById("passwordInput");
  const loginSubmitButton = document.getElementById("loginSubmitButton");
  const registerButton = document.getElementById("registerButton");
  const logoutButton = document.getElementById("logoutButton");
  const deleteAccountButton = document.getElementById("deleteAccountButton");
  const authPanel = document.getElementById("authPanel");
  const accountStatus = document.getElementById("accountStatus");
  const loginTimeLabel = document.getElementById("loginTimeLabel");
  const historyPanel = document.getElementById("historyPanel");
  const historyList = document.getElementById("historyList");
  const worldRankingList = document.getElementById("worldRankingList");
  const worldRankingMeta = document.getElementById("worldRankingMeta");
  const rankingTypeHighButton = document.getElementById("rankingTypeHighButton");
  const rankingTypeCoinsButton = document.getElementById("rankingTypeCoinsButton");
  const rankingHighSubTabs = document.getElementById("rankingHighSubTabs");
  const ranking1PButton = document.getElementById("ranking1PButton");
  const ranking2PButton = document.getElementById("ranking2PButton");
  const difficultyEasyButton = document.getElementById("difficultyEasyButton");
  const difficultyNormalButton = document.getElementById(
    "difficultyNormalButton"
  );
  const difficultyHardButton = document.getElementById("difficultyHardButton");
  const modeCoopButton = document.getElementById("modeCoopButton");
  const modeVersusButton = document.getElementById("modeVersusButton");
  const modeVersus2Button = document.getElementById("modeVersus2Button");
  const modeHardCoopButton = document.getElementById("modeHardCoopButton");
  const timeFormat24Button = document.getElementById("timeFormat24Button");
  const timeFormat12Button = document.getElementById("timeFormat12Button");
  const ampmOnButton = document.getElementById("ampmOnButton");
  const ampmOffButton = document.getElementById("ampmOffButton");
  const ampmSettingsRow = document.getElementById("ampmSettingsRow");
  const soundOnButton = document.getElementById("soundOnButton");
  const soundOffButton = document.getElementById("soundOffButton");
  const bgmOnButton = document.getElementById("bgmOnButton");
  const bgmOffButton = document.getElementById("bgmOffButton");
  const historyOnButton = document.getElementById("historyOnButton");
  const historyOffButton = document.getElementById("historyOffButton");
  const rankingOnButton = document.getElementById("rankingOnButton");
  const rankingOffButton = document.getElementById("rankingOffButton");

  const WIDTH = canvas.width;
  const HEIGHT = canvas.height;

  const TILE_SIZE = 8;
  const SCORE_BAR_HEIGHT = 14;
  const HIGH_SCORE_KEY = "coinHunterHighScore";
  const HIGH_SCORE_2P_KEY = "coinHunterHighScore2P";
  const TOTAL_COINS_KEY = "coinHunterTotalCoins";
  const TIME_FORMAT_KEY = "coinHunterTimeFormat";
  const SHOW_AMPM_KEY = "coinHunterShowAmPm";
  const SOUND_ENABLED_KEY = "coinHunterSoundEnabled";
  const BGM_ENABLED_KEY = "coinHunterBgmEnabled";
  const HISTORY_ENABLED_KEY = "coinHunterHistoryEnabled";
  const RANKING_ENABLED_KEY = "coinHunterRankingEnabled";
  const DIFFICULTY_KEY = "coinHunterDifficulty";
  const TWO_PLAYER_RULE_KEY = "coinHunterTwoPlayerRule";
  const API_BASE = "api";

  const DIFFICULTY_HITS = {
    easy: 5,
    normal: 3,
    hard: 1
  };
  const HIT_IFRAME_MS = 1200;
  const COOP_REVIVE_MS = 10000;

  function normalizeDifficulty(value) {
    if (value === "easy" || value === "hard" || value === "normal") {
      return value;
    }

    return "normal";
  }

  function normalizeTwoPlayerRule(value) {
    if (
      value === "versus" ||
      value === "versus2" ||
      value === "hardcoop" ||
      value === "coop"
    ) {
      return value;
    }

    return "coop";
  }

  const keys = {};

  let score = 0;
  let score2 = 0;
  let highScore1P = Number(localStorage.getItem(HIGH_SCORE_KEY)) || 0;
  let highScore2P = Number(localStorage.getItem(HIGH_SCORE_2P_KEY)) || 0;
  let highScore = highScore1P;
  let highScoreAtStart = highScore;
  let totalCoins = Number(localStorage.getItem(TOTAL_COINS_KEY)) || 0;
  let lastTotalCoinsSyncAt = 0;
  let gameOver = false;
  let historyRecorded = false;
  let confirmingClearData = false;
  let paused = false;
  let countdownPhase = null;
  let countdownPhaseStartedAt = 0;
  let needsStartGesture = true;
  let physicalKeyboardConnected = false;
  let animationId = null;
  let lastFrameTime = performance.now();
  let invincibleRemainingMs = 0;
  let invincibleRemainingMs2 = 0;
  let damageIframeMs = 0;
  let damageIframeMs2 = 0;
  let starCooldownCoins = 0;
  let healCooldownCoins = 0;
  let runTimeMs = 0;
  let runStartedAt = Date.now();
  let runEndedAt = 0;
  let twoPlayerMode = false;
  let difficulty = normalizeDifficulty(localStorage.getItem(DIFFICULTY_KEY));
  let twoPlayerRule = normalizeTwoPlayerRule(
    localStorage.getItem(TWO_PLAYER_RULE_KEY)
  );
  let hitPoints = DIFFICULTY_HITS[difficulty];
  let hitPoints2 = DIFFICULTY_HITS[difficulty];
  let reviveRemainingMs2 = 0;
  let versusWinner = null;
  let loggedInUsername = null;
  let loginAt = 0;
  let authPanelOpen = false;
  let playHistory = [];
  let worldRanking1P = [];
  let worldRanking2P = [];
  let worldRankingCoins = [];
  let rankingType = "high";
  let rankingMode = "1p";
  let onlinePollTimer = null;
  let timeFormat = localStorage.getItem(TIME_FORMAT_KEY) === "12" ? "12" : "24";
  let showAmPm = localStorage.getItem(SHOW_AMPM_KEY) !== "0";
  let soundEnabled = localStorage.getItem(SOUND_ENABLED_KEY) !== "0";
  let bgmEnabled = localStorage.getItem(BGM_ENABLED_KEY) !== "0";
  let historyEnabled = localStorage.getItem(HISTORY_ENABLED_KEY) !== "0";

  function ensureAudioContext() {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;

    if (!AudioCtx) {
      return null;
    }

    if (!audioContext) {
      audioContext = new AudioCtx();
    }

    if (!bgmGainNode && audioContext) {
      bgmGainNode = audioContext.createGain();
      bgmGainNode.gain.value = 0.2;
      bgmGainNode.connect(audioContext.destination);
    }

    return audioContext;
  }

  function unlockAudio() {
    const ctxAudio = ensureAudioContext();

    if (!ctxAudio) {
      return Promise.resolve(null);
    }

    const resumePromise =
      ctxAudio.state === "suspended" ? ctxAudio.resume() : Promise.resolve();

    return resumePromise
      .then(() => {
        if (ctxAudio.state === "running") {
          syncBgm();
        }

        return ctxAudio;
      })
      .catch(() => ctxAudio);
  }

  function ensureAudio() {

  function playTone(frequency, duration, type, volume, when, destination) {
    const ctxAudio = ensureAudioContext();

    if (!ctxAudio || !frequency || ctxAudio.state !== "running") {
      return;
    }

    const start = ctxAudio.currentTime + Math.max(0, when || 0);
    const oscillator = ctxAudio.createOscillator();
    const gain = ctxAudio.createGain();
    const peak = Math.max(volume || 0.08, 0.001);
    const noteLength = Math.max(duration || 0.05, 0.04);

    oscillator.type = type || "square";
    oscillator.frequency.setValueAtTime(frequency, start);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(peak, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + noteLength);

    oscillator.connect(gain);
    gain.connect(destination || ctxAudio.destination);
    oscillator.start(start);
    oscillator.stop(start + noteLength + 0.03);
  }

  function playSound(name) {

  function getDesiredBgmMode() {

  function playNoise(duration, volume, when, destination) {
    const ctxAudio = ensureAudioContext();

    if (!ctxAudio || ctxAudio.state !== "running") {
      return;
    }

    const start = ctxAudio.currentTime + Math.max(0, when || 0);
    const length = Math.max(duration || 0.05, 0.02);
    const sampleCount = Math.floor(ctxAudio.sampleRate * length);
    const buffer = ctxAudio.createBuffer(1, sampleCount, ctxAudio.sampleRate);
    const data = buffer.getChannelData(0);

    for (let i = 0; i < sampleCount; i++) {
      data[i] = Math.random() * 2 - 1;
    }

    const source = ctxAudio.createBufferSource();
    const gain = ctxAudio.createGain();
    const peak = Math.max(volume || 0.05, 0.001);

    source.buffer = buffer;
    gain.gain.setValueAtTime(peak, start);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + length);

    source.connect(gain);
    gain.connect(destination || ctxAudio.destination);
    source.start(start);
    source.stop(start + length + 0.02);
  }

  function playKick(when, destination) {
    const ctxAudio = ensureAudioContext();

    if (!ctxAudio || ctxAudio.state !== "running") {
      return;
    }

    const start = ctxAudio.currentTime + Math.max(0, when || 0);
    const oscillator = ctxAudio.createOscillator();
    const gain = ctxAudio.createGain();

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(150, start);
    oscillator.frequency.exponentialRampToValueAtTime(45, start + 0.12);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.22, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.16);

    oscillator.connect(gain);
    gain.connect(destination || ctxAudio.destination);
    oscillator.start(start);
    oscillator.stop(start + 0.18);
  }

  function playSnare(when, destination) {
    playTone(200, 0.05, "triangle", 0.08, when, destination);

  function playHat(when, destination) {

  function scheduleBgmStep(pattern, stepIndex, absoluteTime) {
    if (!audioContext || audioContext.state !== "running") {
      return;
    }

    const when = Math.max(0, absoluteTime - audioContext.currentTime);
    const melody = pattern.melody[stepIndex % pattern.melody.length];
    const bass = pattern.bass[stepIndex % pattern.bass.length];
    const kick = pattern.kick[stepIndex % pattern.kick.length];
    const snare = pattern.snare[stepIndex % pattern.snare.length];
    const hat = pattern.hat[stepIndex % pattern.hat.length];

    if (melody) {
      playTone(melody, pattern.stepSec * 0.8, "square", 0.12, when, bgmGainNode);
    }

    if (bass) {
      playTone(bass, pattern.stepSec * 0.85, "triangle", 0.1, when, bgmGainNode);
    }

    if (kick) {
      playKick(when, bgmGainNode);
    }

    if (snare) {
      playSnare(when, bgmGainNode);
    }

    if (hat) {
      playHat(when, bgmGainNode);
    }
  }

  function startBgm(mode) {
    const ctxAudio = ensureAudioContext();

    if (!ctxAudio || !BGM_PATTERNS[mode]) {
      return;
    }

    bgmMode = mode;
    bgmStep = 0;
    bgmNextNoteTime = ctxAudio.currentTime + 0.08;
  }

  function stopBgm() {
    bgmMode = null;
    bgmStep = 0;
    bgmNextNoteTime = 0;
  }

  function tickBgm() {
    if (!bgmMode || !bgmEnabled || !audioContext || !bgmGainNode) {
      return;
    }

    if (audioContext.state !== "running") {
      return;
    }

    const pattern = BGM_PATTERNS[bgmMode];

    while (bgmNextNoteTime < audioContext.currentTime + 0.2) {
      scheduleBgmStep(pattern, bgmStep, bgmNextNoteTime);
      bgmNextNoteTime += pattern.stepSec;
      bgmStep += 1;
    }
  }

  function syncBgm() {
    const desired = getDesiredBgmMode();

    if (desired !== bgmMode) {
      stopBgm();

      if (desired) {
        startBgm(desired);
      }
    }

    tickBgm();
  }

    const found = [];

    touchControls
      .querySelectorAll("button[data-keys]")
      .forEach((button) => {
        const rect = button.getBoundingClientRect();

        if (
          clientX >= rect.left - TOUCH_SLIDE_MARGIN_PX &&
          clientX <= rect.right + TOUCH_SLIDE_MARGIN_PX &&
          clientY >= rect.top - TOUCH_SLIDE_MARGIN_PX &&
          clientY <= rect.bottom + TOUCH_SLIDE_MARGIN_PX

    for (const keyName of getTouchKeyNames(button)) {
      if (pressed) {
        keys[keyName] = true;

      let heldByOthers = false;

      for (const [otherId, buttons] of activeTouchPointers) {
        if (otherId === pointerId) {
          continue;
        }

        for (const otherButton of buttons) {
          if (getTouchKeyNames(otherButton).includes(keyName)) {
            heldByOthers = true;
            break;

        if (heldByOthers) {
          break;

      if (!heldByOthers) {
        keys[keyName] = false;
      }
    }

    if (pressed) {
      button.classList.add("active");
      return;
    }

    let buttonHeldByOthers = false;

    for (const [otherId, buttons] of activeTouchPointers) {
      if (otherId !== pointerId && buttons.has(button)) {
        buttonHeldByOthers = true;
        break;

    const nextButtons = new Set(
      touchButtonsAtPoint(event.clientX, event.clientY)
    );

    for (const button of previousButtons) {
      if (!nextButtons.has(button)) {
        setTouchButtonPressed(button, false, event.pointerId);
      }
    }

    activeTouchPointers.set(event.pointerId, nextButtons);

    for (const button of nextButtons) {
      if (!previousButtons.has(button)) {
        setTouchButtonPressed(button, true, event.pointerId);
      }
    }

      return;
    }

    paused = true;
    clearMovementKeys();
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      pauseForBackground();
    } else {
      unlockAudio();
    }
  });

  window.addEventListener("blur", () => {
    pauseForBackground();
  });

  window.addEventListener("focus", () => {
    unlockAudio();
  });

  restartButton.addEventListener("click", () => {
    if (confirmingClearData) {
      return;
    }

    restartGame();
  });

  twoPlayerButton.addEventListener("click", () => {
    if (confirmingClearData || needsStartGesture) {
      return;
    }

    twoPlayerMode = !twoPlayerMode;
    twoPlayerButton.textContent = twoPlayerMode ? "1P" : "2P";
    refreshHighScoreForMode();
    updateTouchControlsVisibility();
    restartGame();
  });

  clearDataButton.addEventListener("click", () => {
    confirmingClearData = true;
  });

  canvas.addEventListener("pointerdown", (event) => {
    if (confirmingClearData || !needsStartGesture) {
      return;
    }

    event.preventDefault();
    beginGameFromGesture();
  });

  canvas.addEventListener("click", (event) => {
    if (!confirmingClearData) {
      return;
    }

    const rect = canvas.getBoundingClientRect();
    const scaleX = WIDTH / rect.width;
    const scaleY = HEIGHT / rect.height;
    const x = (event.clientX - rect.left) * scaleX;
    const y = (event.clientY - rect.top) * scaleY;

    if (hitClearConfirmButton(clearConfirmButtons.yes, x, y)) {
      executeClearSavedData();
      return;
    }

    if (hitClearConfirmButton(clearConfirmButtons.no, x, y)) {
      confirmingClearData = false;
    }
  });

  function hitClearConfirmButton(button, x, y) {
    return (
      x >= button.x &&
      x <= button.x + button.width &&
      y >= button.y &&
      y <= button.y + button.height
    );
  }

  /*
   * 敵を作る
   */
  function createEnemy() {
    const size = 16;
    const minDistance = 80;
    let x = 0;
    let y = 0;
    let attempts = 0;

    do {
      x = randomGridPosition(WIDTH - size);
      y = randomGridPosition(HEIGHT - size);
      attempts++;
    } while (
      attempts < 100 &&
      (isTooClose(x, y, player.x, player.y, minDistance) ||
        (twoPlayerMode &&
          isTooClose(x, y, player2.x, player2.y, minDistance)) ||
        enemies.some((enemy) =>
          isTooClose(x, y, enemy.x, enemy.y, minDistance)
        ))
    );

    const enemy = {
      x,
      y,
      width: size,
      height: size,
      speed: 0.5 + Math.random() * 0.8 + totalScore() * 0.02,
      speedX: 0,
      speedY: 0
    };

    setEnemyDirection(enemy);
    enemies.push(enemy);
  }

  function isTooClose(x1, y1, x2, y2, minDistance) {
    return (
      Math.abs(x1 - x2) < minDistance &&
      Math.abs(y1 - y2) < minDistance
    );
  }

  /*
   * 横・縦・斜めどれかの方向をセット
   */
  function setEnemyDirection(enemy, blocked = {}) {
    const directions = [
      { x: -1, y: 0 },
      { x: 1, y: 0 },
      { x: 0, y: -1 },
      { x: 0, y: 1 },
      { x: -1, y: -1 },
      { x: 1, y: -1 },
      { x: -1, y: 1 },
      { x: 1, y: 1 }
    ].filter((direction) => {
      if (blocked.left && direction.x < 0) {
        return false;
      }

      if (blocked.right && direction.x > 0) {
        return false;
      }

      if (blocked.top && direction.y < 0) {
        return false;
      }

      if (blocked.bottom && direction.y > 0) {
        return false;
      }

      return true;
    });

    const direction =
      directions[Math.floor(Math.random() * directions.length)];

    enemy.speedX = direction.x * enemy.speed;
    enemy.speedY = direction.y * enemy.speed;
  }

  /*
   * 8ピクセル単位のランダム位置
   */
  function randomGridPosition(maximum) {
    const tiles = Math.floor(maximum / TILE_SIZE);
    return Math.floor(Math.random() * tiles) * TILE_SIZE;
  }

  /*
   * コインを別の場所へ移動
   */
  function moveCoin() {
    let validPosition = false;

    while (!validPosition) {
      coin.x = randomGridPosition(WIDTH - coin.width);
      /*
       * スコア表示の下から置く
       */
      coin.y =
        SCORE_BAR_HEIGHT +
        randomGridPosition(HEIGHT - SCORE_BAR_HEIGHT - coin.height);

      validPosition =
        !enemies.some((enemy) => checkCollision(coin, enemy)) &&
        !(
          invincibleItem.active &&
          checkCollision(coin, invincibleItem)
        ) &&
        !(healItem.active && checkCollision(coin, healItem));
    }
  }

  /*
   * アイテム用の空きマスを探す
   */
  function findItemSpawnPosition(itemWidth, itemHeight, extraBlocked) {
    const maxAttempts = 48;

    for (let attempt = 0; attempt < maxAttempts; attempt++) {
      const x = randomGridPosition(WIDTH - itemWidth);
      const y =
        SCORE_BAR_HEIGHT +
        randomGridPosition(HEIGHT - SCORE_BAR_HEIGHT - itemHeight);
      const spot = { x, y, width: itemWidth, height: itemHeight };

      const blocked =
        checkCollision(spot, coin) ||
        checkCollision(spot, player) ||
        (twoPlayerMode && checkCollision(spot, player2)) ||
        enemies.some((enemy) => checkCollision(spot, enemy)) ||
        (typeof extraBlocked === "function" && extraBlocked(spot));

      if (!blocked) {
        return { x, y };
      }
    }

    return {
      x: randomGridPosition(WIDTH - itemWidth),
      y:
        SCORE_BAR_HEIGHT +
        randomGridPosition(HEIGHT - SCORE_BAR_HEIGHT - itemHeight)
    };
  }

  /*
   * 無敵アイテムを出現させる
   */
  function spawnInvincibleItem() {
    const position = findItemSpawnPosition(
      invincibleItem.width,
      invincibleItem.height,
      (spot) => healItem.active && checkCollision(spot, healItem)
    );

    invincibleItem.x = position.x;
    invincibleItem.y = position.y;
    invincibleItem.active = true;
    invincibleItem.remainingMs = INVINCIBLE_ITEM_LIFETIME_MS;
    playSound("starSpawn");
  }

  /*
   * 回復アイテムを出現させる
   */
  function spawnHealItem() {
    if (!canSpawnHealItem()) {
      return;
    }

    const position = findItemSpawnPosition(
      healItem.width,
      healItem.height,
      (spot) =>
        invincibleItem.active && checkCollision(spot, invincibleItem)
    );

    healItem.x = position.x;
    healItem.y = position.y;
    healItem.active = true;
    healItem.remainingMs = HEAL_ITEM_LIFETIME_MS;
    playSound("healSpawn");
  }

  function isSeparateLifeMode() {
    return twoPlayerMode;
  }

  function getPlayerHitPoints(target) {
    if (isSeparateLifeMode() && target === player2) {
      return hitPoints2;
    }

    return hitPoints;
  }

  function setPlayerHitPoints(target, value) {
    if (isSeparateLifeMode() && target === player2) {
      hitPoints2 = value;
    } else {
      hitPoints = value;
    }
  }

  function getDamageIframeMs(target) {
    if (isSeparateLifeMode() && target === player2) {
      return damageIframeMs2;
    }

    return damageIframeMs;
  }

  function setDamageIframeMs(target, value) {
    if (isSeparateLifeMode() && target === player2) {
      damageIframeMs2 = value;
    } else if (isSeparateLifeMode()) {
      damageIframeMs = value;
    } else {
      damageIframeMs = value;
      damageIframeMs2 = 0;
    }
  }

  function canSpawnHealItem() {
    if (isSeparateLifeMode()) {
      return (
        (hitPoints > 0 && hitPoints < maxHitPoints()) ||
        (hitPoints2 > 0 && hitPoints2 < maxHitPoints())
      );
    }

    return hitPoints < maxHitPoints();
  }

  function isPlayerAlive(target) {
    return getPlayerHitPoints(target) > 0;
  }

  function getActivePlayers() {
    if (!twoPlayerMode) {
      return isPlayerAlive(player) ? [player] : [];
    }

    const players = [];

    if (isPlayerAlive(player)) {
      players.push(player);
    }

    if (isPlayerAlive(player2)) {
      players.push(player2);
    }

    return players;
  }

  function getPlayerInvincibleMs(target) {
    return target === player2
      ? invincibleRemainingMs2
      : invincibleRemainingMs;
  }

  function setPlayerInvincibleMs(target, value) {
    if (target === player2) {
      invincibleRemainingMs2 = value;
    } else {
      invincibleRemainingMs = value;
    }
  }

  /*
   * プレイヤーの移動
   */
  function updateOnePlayer(target, controls) {
    const previousX = target.x;
    const previousY = target.y;
    const moveSpeed =
      getPlayerInvincibleMs(target) > 0 ? target.speed * 1.2 : target.speed;

    if (controls.left.some((key) => keys[key])) {
      target.x -= moveSpeed;
    }

    if (controls.right.some((key) => keys[key])) {
      target.x += moveSpeed;
    }

    if (controls.up.some((key) => keys[key])) {
      target.y -= moveSpeed;
    }

    if (controls.down.some((key) => keys[key])) {
      target.y += moveSpeed;
    }

    target.x = Math.max(
      0,
      Math.min(WIDTH - target.width, target.x)
    );

    target.y = Math.max(
      0,
      Math.min(HEIGHT - target.height, target.y)
    );

    target.vx = target.x - previousX;
    target.vy = target.y - previousY;
  }

  function updatePlayers() {
    if (isPlayerAlive(player)) {
      updateOnePlayer(player, {
        left: ["ArrowLeft"],
        right: ["ArrowRight"],
        up: ["ArrowUp"],
        down: ["ArrowDown"]
      });
    }

    if (twoPlayerMode && isPlayerAlive(player2)) {
      updateOnePlayer(player2, {
        left: ["a", "A"],
        right: ["d", "D"],
        up: ["w", "W"],
        down: ["s", "S"]
      });
    }
  }

  /*
   * プレイヤーが敵に向かって突っ込んでいるか
   */
  function isPlayerChargingEnemy(target, enemy) {
    if (target.vx === 0 && target.vy === 0) {
      return false;
    }

    const playerCenterX = target.x + target.width / 2;
    const playerCenterY = target.y + target.height / 2;
    const enemyCenterX = enemy.x + enemy.width / 2;
    const enemyCenterY = enemy.y + enemy.height / 2;

    return (
      target.vx * (enemyCenterX - playerCenterX) +
        target.vy * (enemyCenterY - playerCenterY) >
      0
    );
  }

  /*
   * 敵の移動
   */
  function updateEnemies() {
    for (const enemy of enemies) {
      enemy.x += enemy.speedX;
      enemy.y += enemy.speedY;

      const hitLeft = enemy.x <= 0;
      const hitRight = enemy.x + enemy.width >= WIDTH;
      const hitTop = enemy.y <= 0;
      const hitBottom = enemy.y + enemy.height >= HEIGHT;

      if (hitLeft || hitRight || hitTop || hitBottom) {
        enemy.x = Math.max(
          0,
          Math.min(WIDTH - enemy.width, enemy.x)
        );
        enemy.y = Math.max(
          0,
          Math.min(HEIGHT - enemy.height, enemy.y)
        );

        setEnemyDirection(enemy, {
          left: hitLeft,
          right: hitRight,
          top: hitTop,
          bottom: hitBottom
        });
      }
    }
  }

  /*
   * 当たり判定
   */
  function checkCollision(objectA, objectB) {
    return (
      objectA.x < objectB.x + objectB.width &&
      objectA.x + objectA.width > objectB.x &&
      objectA.y < objectB.y + objectB.height &&
      objectA.y + objectA.height > objectB.y
    );
  }

  function totalScore() {
    return twoPlayerMode ? score + score2 : score;
  }

  function leadingScore() {
    return twoPlayerMode ? Math.max(score, score2) : score;
  }

  /*
   * コインと敵の当たり判定
   */
  function onCoinCollected(collector) {
    if (collector === player2) {
      score2++;
    } else {
      score++;
    }

    playSound("coin");

    if (loggedInUsername) {
      totalCoins += 1;
      localStorage.setItem(TOTAL_COINS_KEY, String(totalCoins));
      syncTotalCoinsThrottled();
    }

    const best = leadingScore();
    const previousBest =
      collector === player2
        ? Math.max(score, score2 - 1)
        : Math.max(score - 1, score2);
    const isNewHigh = best > highScore;
    const newlyShowNewMark =
      best > highScoreAtStart && previousBest <= highScoreAtStart;

    if (isNewHigh) {
      highScore = best;
      saveHighScore(highScore);
    }

    if (newlyShowNewMark) {
      playSound("highScore");
    }

    moveCoin();

    if (totalScore() % 3 === 0) {
      createEnemy();
      playSound("enemySpawn");
    }

    if (
      !invincibleItem.active &&
      starCooldownCoins <= 0 &&
      Math.random() < INVINCIBLE_ITEM_CHANCE
    ) {
      spawnInvincibleItem();
    }

    if (
      !healItem.active &&
      healCooldownCoins <= 0 &&
      canSpawnHealItem() &&
      Math.random() < HEAL_ITEM_CHANCE
    ) {
      spawnHealItem();
    }

    if (starCooldownCoins > 0) {
      starCooldownCoins--;
    }

    if (healCooldownCoins > 0) {
      healCooldownCoins--;
    }
  }

  function checkGameCollisions() {
    const activePlayers = getActivePlayers();

    for (const target of activePlayers) {
      if (checkCollision(target, coin)) {
        onCoinCollected(target);
        break;
      }
    }

    if (invincibleItem.active) {
      for (const target of activePlayers) {
        if (checkCollision(target, invincibleItem)) {
          invincibleItem.active = false;
          invincibleItem.remainingMs = 0;
          setPlayerInvincibleMs(target, INVINCIBLE_DURATION_MS);
          starCooldownCoins = STAR_COOLDOWN_COINS;
          playSound("starGet");
          break;
        }
      }
    }

    if (healItem.active) {
      for (const target of activePlayers) {
        if (checkCollision(target, healItem)) {
          healItem.active = false;
          healItem.remainingMs = 0;
          healCooldownCoins = HEAL_COOLDOWN_COINS;
          setPlayerHitPoints(
            target,
            Math.min(maxHitPoints(), getPlayerHitPoints(target) + 1)
          );
          playSound("healGet");
          break;
        }
      }
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
      const enemy = enemies[i];
      let removed = false;

      for (const target of activePlayers) {
        if (!checkCollision(target, enemy)) {
          continue;
        }

        if (getPlayerInvincibleMs(target) > 0) {
          if (isPlayerChargingEnemy(target, enemy)) {
            enemies.splice(i, 1);
            playSound("enemyHit");
            removed = true;
            break;
          }
        } else if (getDamageIframeMs(target) <= 0) {
          applyEnemyDamage(target);

          if (gameOver) {
            return;
          }

          break;
        }
      }

      if (removed) {
        continue;
      }
    }
  }

  /*
   * 背景のドット模様
   */
  function drawBackground() {
    ctx.fillStyle = "#101820";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    ctx.fillStyle = "#182c38";

    for (let y = 0; y < HEIGHT; y += 16) {
      for (let x = 0; x < WIDTH; x += 16) {
        ctx.fillRect(x, y, 2, 2);
      }
    }
  }

  /*
   * プレイヤーを描く
   */
  function drawOnePlayer(target, invincibleMs) {
    if (!isPlayerAlive(target)) {
      return;
    }

    const isInvincible = invincibleMs > 0;
    const isDamaged = getDamageIframeMs(target) > 0;
    const flashOn =
      (!isInvincible && !isDamaged) ||
      Math.floor(performance.now() / 100) % 2 === 0;

    if (!flashOn) {
      ctx.globalAlpha = 0.35;
    }

    const colors = target.colors;

    ctx.fillStyle = isInvincible ? colors.invBody : colors.body;
    ctx.fillRect(target.x, target.y, 16, 16);

    ctx.fillStyle = isInvincible ? colors.invLight : colors.light;
    ctx.fillRect(target.x + 2, target.y + 2, 12, 4);

    ctx.fillStyle = "white";
    ctx.fillRect(target.x + 3, target.y + 6, 4, 4);
    ctx.fillRect(target.x + 9, target.y + 6, 4, 4);

    ctx.fillStyle = "black";
    ctx.fillRect(target.x + 5, target.y + 8, 2, 2);
    ctx.fillRect(target.x + 11, target.y + 8, 2, 2);

    ctx.fillStyle = isInvincible ? colors.invFeet : colors.feet;
    ctx.fillRect(target.x + 2, target.y + 14, 4, 2);
    ctx.fillRect(target.x + 10, target.y + 14, 4, 2);

    ctx.globalAlpha = 1;

    ctx.fillStyle = isInvincible ? colors.invBody : colors.light;
    ctx.font = '10px "DotGothic16", monospace';
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    ctx.fillText(
      isInvincible ? "INV" : target.label,
      target.x + target.width / 2,
      Math.max(SCORE_BAR_HEIGHT + 2, target.y - 1)
    );
    ctx.textAlign = "left";
  }

  function drawPlayers() {
    drawOnePlayer(player, invincibleRemainingMs);

    if (twoPlayerMode) {
      drawOnePlayer(player2, invincibleRemainingMs2);
    }
  }

  /*
   * コインを描く
   */
  function drawCoin() {
    ctx.fillStyle = "#ffcc00";
    ctx.fillRect(coin.x + 2, coin.y, 4, 8);
    ctx.fillRect(coin.x, coin.y + 2, 8, 4);

    ctx.fillStyle = "#fff17a";
    ctx.fillRect(coin.x + 2, coin.y + 1, 2, 4);
  }

  /*
   * 無敵アイテムを描く
   */
  function drawInvincibleItem() {
    if (!invincibleItem.active) {
      return;
    }

    const x = invincibleItem.x;
    const y = invincibleItem.y;
    const blink = Math.floor(performance.now() / 200) % 2 === 0;

    ctx.fillStyle = blink ? "#7ef9ff" : "#ffffff";
    ctx.fillRect(x + 4, y, 2, 10);
    ctx.fillRect(x, y + 4, 10, 2);
    ctx.fillRect(x + 2, y + 2, 6, 6);

    ctx.fillStyle = "#2bb8c8";
    ctx.fillRect(x + 4, y + 4, 2, 2);
  }

  function drawHealItem() {
    if (!healItem.active) {
      return;
    }

    const x = healItem.x;
    const y = healItem.y;
    const blink = Math.floor(performance.now() / 180) % 2 === 0;

    ctx.fillStyle = blink ? "#7CFC00" : "#b8ff70";
    ctx.fillRect(x + 2, y + 1, 2, 2);
    ctx.fillRect(x + 6, y + 1, 2, 2);
    ctx.fillRect(x + 1, y + 3, 8, 3);
    ctx.fillRect(x + 2, y + 6, 6, 2);
    ctx.fillRect(x + 3, y + 8, 4, 1);
    ctx.fillRect(x + 4, y + 9, 2, 1);

    ctx.fillStyle = "#2e7d32";
    ctx.fillRect(x + 4, y + 4, 2, 2);
  }

  /*
   * 敵を描く
   */
  function drawEnemies() {
    for (const enemy of enemies) {
      ctx.fillStyle = "#e53935";
      ctx.fillRect(enemy.x, enemy.y, 16, 16);

      ctx.fillStyle = "#ff706b";
      ctx.fillRect(enemy.x + 2, enemy.y + 2, 12, 4);

      /*
       * 怒った目
       */
      ctx.fillStyle = "white";
      ctx.fillRect(enemy.x + 3, enemy.y + 7, 4, 3);
      ctx.fillRect(enemy.x + 9, enemy.y + 7, 4, 3);

      ctx.fillStyle = "black";
      ctx.fillRect(enemy.x + 3, enemy.y + 7, 2, 2);
      ctx.fillRect(enemy.x + 11, enemy.y + 7, 2, 2);

      /*
       * 足
       */
      ctx.fillStyle = "#8a1010";
      ctx.fillRect(enemy.x + 1, enemy.y + 14, 5, 2);
      ctx.fillRect(enemy.x + 10, enemy.y + 14, 5, 2);
    }
  }

  function formatRunTime(ms) {
    const totalMs = Math.max(0, Math.floor(ms));
    const millis = String(totalMs % 1000).padStart(3, "0");
    const totalSeconds = Math.floor(totalMs / 1000);
    const seconds = totalSeconds % 60;
    const totalMinutes = Math.floor(totalSeconds / 60);
    const minutes = totalMinutes % 60;
    const hours = Math.floor(totalMinutes / 60);

    if (hours > 0) {
      return `${hours}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}.${millis}`;
    }

    if (totalMinutes > 0) {
      return `${totalMinutes}:${String(seconds).padStart(2, "0")}.${millis}`;
    }

    return `${seconds}.${millis}`;
  }

  function formatClockHm(timestamp) {
    const date = new Date(timestamp);
    let hours = date.getHours();
    const minutes = String(date.getMinutes()).padStart(2, "0");
    const seconds = String(date.getSeconds()).padStart(2, "0");

    if (timeFormat === "12") {
      const suffix = hours >= 12 ? "PM" : "AM";
      hours = hours % 12;

      if (hours === 0) {
        hours = 12;
      }

      const clock = `${hours}:${minutes}:${seconds}`;
      return showAmPm ? `${suffix} ${clock}` : clock;
    }

    return `${String(hours).padStart(2, "0")}:${minutes}:${seconds}`;
  }

  function updateSettingsView() {
    difficultyEasyButton.classList.toggle("active", difficulty === "easy");
    difficultyNormalButton.classList.toggle("active", difficulty === "normal");
    difficultyHardButton.classList.toggle("active", difficulty === "hard");
    modeCoopButton.classList.toggle("active", twoPlayerRule === "coop");
    modeVersusButton.classList.toggle("active", twoPlayerRule === "versus");
    modeVersus2Button.classList.toggle("active", twoPlayerRule === "versus2");
    modeHardCoopButton.classList.toggle(
      "active",
      twoPlayerRule === "hardcoop"
    );
    timeFormat24Button.classList.toggle("active", timeFormat === "24");
    timeFormat12Button.classList.toggle("active", timeFormat === "12");
    ampmOnButton.classList.toggle("active", showAmPm);
    ampmOffButton.classList.toggle("active", !showAmPm);
    ampmSettingsRow.classList.toggle("disabled", timeFormat !== "12");
    soundOnButton.classList.toggle("active", soundEnabled);
    soundOffButton.classList.toggle("active", !soundEnabled);
    bgmOnButton.classList.toggle("active", bgmEnabled);
    bgmOffButton.classList.toggle("active", !bgmEnabled);
    historyOnButton.classList.toggle("active", historyEnabled);
    historyOffButton.classList.toggle("active", !historyEnabled);
    rankingOnButton.classList.toggle("active", rankingEnabled);
    rankingOffButton.classList.toggle("active", !rankingEnabled);
  }

  function saveTimeSettings() {
    localStorage.setItem(DIFFICULTY_KEY, difficulty);
    localStorage.setItem(TWO_PLAYER_RULE_KEY, twoPlayerRule);
    localStorage.setItem(TIME_FORMAT_KEY, timeFormat);
    localStorage.setItem(SHOW_AMPM_KEY, showAmPm ? "1" : "0");
    localStorage.setItem(SOUND_ENABLED_KEY, soundEnabled ? "1" : "0");
    localStorage.setItem(BGM_ENABLED_KEY, bgmEnabled ? "1" : "0");
    localStorage.setItem(HISTORY_ENABLED_KEY, historyEnabled ? "1" : "0");
    localStorage.setItem(RANKING_ENABLED_KEY, rankingEnabled ? "1" : "0");
    updateSettingsView();
    updateLoginTimeLabel();
    renderHistoryList();
    syncBgm();
  }

  function setDifficulty(nextDifficulty) {
    const normalized = normalizeDifficulty(nextDifficulty);

    if (difficulty === normalized) {
      updateSettingsView();
      return;
    }

    difficulty = normalized;
    saveTimeSettings();

    if (needsStartGesture) {
      resetHitPoints();
      return;
    }

    restartGame();
  }

  function setTwoPlayerRule(nextRule) {
    const normalized = normalizeTwoPlayerRule(nextRule);

    if (twoPlayerRule === normalized) {
      updateSettingsView();
      return;
    }

    twoPlayerRule = normalized;
    saveTimeSettings();

    if (needsStartGesture) {
      resetHitPoints();
      return;
    }

    restartGame();
  }

  function maxHitPoints() {
    return DIFFICULTY_HITS[difficulty];
  }

  function resetHitPoints() {
    hitPoints = maxHitPoints();
    hitPoints2 = maxHitPoints();
    damageIframeMs = 0;
    damageIframeMs2 = 0;
    reviveRemainingMs2 = 0;
    versusWinner = null;
  }

  function difficultyLabel(value) {
    const key = normalizeDifficulty(value || difficulty);

    if (key === "easy") {
      return "EASY";
    }

    if (key === "hard") {
      return "HARD";
    }

    return "NORMAL";
  }

  function twoPlayerRuleLabel(value) {
    const key = normalizeTwoPlayerRule(value || twoPlayerRule);

    if (key === "versus") {
      return "対戦";
    }

    if (key === "versus2") {
      return "対戦2";
    }

    if (key === "hardcoop") {
      return "HARD協力";
    }

    return "協力";
  }

  function startCoopReviveP2() {
    hitPoints2 = 0;
    invincibleRemainingMs2 = 0;
    damageIframeMs2 = 0;
    reviveRemainingMs2 = COOP_REVIVE_MS;
  }

  function applyEnemyDamage(target) {
    if (gameOver || getDamageIframeMs(target) > 0 || !isPlayerAlive(target)) {
      return;
    }

    const nextHits = getPlayerHitPoints(target) - 1;
    setPlayerHitPoints(target, Math.max(0, nextHits));
    playSound("enemyHit");
    setDamageIframeMs(target, HIT_IFRAME_MS);

    if (getPlayerHitPoints(target) > 0) {
      return;
    }

    if (!twoPlayerMode) {
      triggerGameOver();
      return;
    }

    if (twoPlayerRule === "coop") {
      if (target === player) {
        triggerGameOver();
        return;
      }

      startCoopReviveP2();
      return;
    }

    if (twoPlayerRule === "versus") {
      versusWinner = target === player ? "p2" : "p1";
      triggerGameOver();
      return;
    }

    if (twoPlayerRule === "versus2") {
      if (score > score2) {
        versusWinner = "p1";
      } else if (score2 > score) {
        versusWinner = "p2";
      } else {
        versusWinner = "draw";
      }

      triggerGameOver();
      return;
    }

    triggerGameOver();
  }

  function updateLoginTimeLabel() {
    if (!loggedInUsername || !loginAt) {
      loginTimeLabel.classList.remove("visible");
      loginTimeLabel.textContent = "";
      return;
    }

    loginTimeLabel.textContent = `ログイン ${formatClockHm(loginAt)}`;
    loginTimeLabel.classList.add("visible");
  }

  function triggerGameOver() {
    if (gameOver) {
      return;
    }

    gameOver = true;
    runEndedAt = Date.now();
    stopBgm();
    playSound("gameOver");
    recordPlayHistory();
    updatePlayingUi();
  }

  /*
   * スコア表示
   */
  function drawScore() {
    ctx.font = '10px "DotGothic16", monospace';
    ctx.textBaseline = "middle";

    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, WIDTH, SCORE_BAR_HEIGHT);

    const textY = SCORE_BAR_HEIGHT / 2;
    const isHighScoreUpdating = leadingScore() > highScoreAtStart;
    const total = score + score2;
    const hiText = twoPlayerMode ? `HI2 ${highScore}` : `HI ${highScore}`;
    const newText = isHighScoreUpdating ? "NEW!" : "";
    const rightReserve =
      ctx.measureText(hiText).width +
      (newText ? ctx.measureText(newText).width + 4 : 0) +
      8;

    let x = 2;

    function drawLeft(text, color) {
      const width = ctx.measureText(text).width;

      if (x + width > WIDTH - rightReserve) {
        return false;
      }

      ctx.fillStyle = color;
      ctx.fillText(text, x, textY);
      x += width + 5;
      return true;
    }

    if (twoPlayerMode) {
      drawLeft(`SC ${score}`, "white");
      drawLeft(`2PSC ${score2}`, "#81c784");
      drawLeft(`TOT ${total}`, "#ffcc00");
      drawLeft(`L1 ${hitPoints}`, "#ff706b");

      if (invincibleRemainingMs > 0) {
        drawLeft(`${Math.ceil(invincibleRemainingMs / 1000)}`, "#7ef9ff");
      }

      if (reviveRemainingMs2 > 0) {
        drawLeft(`R${Math.ceil(reviveRemainingMs2 / 1000)}`, "#81c784");
      } else {
        drawLeft(`L2 ${hitPoints2}`, "#81c784");
      }

      if (invincibleRemainingMs2 > 0) {
        drawLeft(`${Math.ceil(invincibleRemainingMs2 / 1000)}`, "#b5f5c8");
      }

      drawLeft(`E ${enemies.length}`, "white");
      drawLeft(formatRunTime(runTimeMs), "white");
    } else {
      drawLeft(`SCORE ${score}`, "white");
      drawLeft(`LIFE ${hitPoints}`, "#ff706b");
      drawLeft(`ENEMY ${enemies.length}`, "white");
      drawLeft(`TIME ${formatRunTime(runTimeMs)}`, "white");

      if (invincibleRemainingMs > 0) {
        drawLeft(
          `INV ${Math.ceil(invincibleRemainingMs / 1000)}`,
          "#7ef9ff"
        );
      }
    }

    let cursorX = WIDTH - 4;

    if (newText) {
      const messageWidth = ctx.measureText(newText).width;
      cursorX -= messageWidth;
      ctx.fillStyle = "#ffcc00";
      ctx.fillText(newText, cursorX, textY);
      cursorX -= 4;
    }

    cursorX -= ctx.measureText(hiText).width;
    ctx.fillStyle = "white";
    ctx.fillText(hiText, cursorX, textY);
  }

  /*
   * ゲームオーバー画面
   */
  function drawGameOver() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#ff3b30";
    ctx.font = '16px "DotGothic16", monospace';
    ctx.fillText("GAME OVER", WIDTH / 2, HEIGHT / 2 - 40);

    ctx.fillStyle = "#ffcc00";
    ctx.font = '10px "DotGothic16", monospace';

    const modeLine = twoPlayerMode
      ? `${difficultyLabel(difficulty)} / ${twoPlayerRuleLabel(twoPlayerRule)}`
      : difficultyLabel(difficulty);
    ctx.fillText(modeLine, WIDTH / 2, HEIGHT / 2 - 26);

    let bodyY = HEIGHT / 2 - 8;

    if (
      twoPlayerMode &&
      (twoPlayerRule === "versus" || twoPlayerRule === "versus2") &&
      versusWinner
    ) {
      if (versusWinner === "draw") {
        ctx.fillStyle = "#ffcc00";
        ctx.fillText("P1 DRAW", WIDTH / 2, bodyY);
        bodyY += 14;
        ctx.fillText("P2 DRAW", WIDTH / 2, bodyY);
        bodyY += 16;
      } else {
        const p1Win = versusWinner === "p1";
        ctx.fillStyle = p1Win ? "#ffe566" : "#ff706b";
        ctx.fillText(
          p1Win ? "P1 YOU WIN!" : "P1 YOU LOSE...",
          WIDTH / 2,
          bodyY
        );
        bodyY += 14;
        ctx.fillStyle = p1Win ? "#ff706b" : "#ffe566";
        ctx.fillText(
          p1Win ? "P2 YOU LOSE..." : "P2 YOU WIN!",
          WIDTH / 2,
          bodyY
        );
        bodyY += 16;
      }
    }

    ctx.fillStyle = "white";
    ctx.font = '10px "DotGothic16", monospace';

    if (twoPlayerMode) {
      ctx.fillText(
        `SC: ${score}  2PSC: ${score2}  TOT: ${score + score2}`,
        WIDTH / 2,
        bodyY
      );
      bodyY += 14;
      ctx.fillText(`HI2: ${highScore}`, WIDTH / 2, bodyY);
      bodyY += 14;
    } else {
      ctx.fillText(
        `SCORE: ${score}  HI: ${highScore}`,
        WIDTH / 2,
        bodyY
      );
      bodyY += 14;
    }

    ctx.fillText(`TIME: ${formatRunTime(runTimeMs)}`, WIDTH / 2, bodyY);
    bodyY += 14;
    ctx.fillText(
      `${formatClockHm(runStartedAt)}〜${formatClockHm(runEndedAt || Date.now())}`,
      WIDTH / 2,
      bodyY
    );
    bodyY += 16;
    ctx.fillText("PRESS SPACE TO RESTART", WIDTH / 2, bodyY);

    ctx.textAlign = "left";
  }

   * ポーズ画面

  function drawPause() {

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
