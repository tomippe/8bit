  function playCountdownSound(phase) {
    if (phase === 0) {
      playSound("countdown");
    } else if (phase === 1) {
      playSound("countdown2");
    } else if (phase === 2) {
      playSound("countdown1");
    } else {
      playSound("start");
    }
  }

  function beginCountdown() {
    countdownPhase = 0;
    countdownPhaseStartedAt = performance.now();
    playCountdownSound(0);
  }

  function updateCountdown(now) {
    if (document.hidden) {
      countdownPhaseStartedAt = now;
      return;
    }

    const duration =
      countdownPhase === COUNTDOWN_LABELS.length - 1
        ? COUNTDOWN_START_MS
        : COUNTDOWN_PHASE_MS;

    if (now - countdownPhaseStartedAt < duration) {
      return;
    }

    countdownPhase += 1;

    if (countdownPhase >= COUNTDOWN_LABELS.length) {
      countdownPhase = null;
      runStartedAt = Date.now();
      lastFrameTime = now;
      return;
    }

    countdownPhaseStartedAt = now;
    playCountdownSound(countdownPhase);
  }

  function drawCountdown() {
    if (countdownPhase === null) {
      return;
    }

    const label = COUNTDOWN_LABELS[countdownPhase];

    ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = label === "START" ? "#ffe566" : "#ffffff";
    ctx.font =
      label === "START"
        ? '22px "DotGothic16", monospace'
        : '36px "DotGothic16", monospace';
    ctx.fillText(label, WIDTH / 2, HEIGHT / 2);

    ctx.textAlign = "left";
  }

  function drawClickToStart() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffe566";
    ctx.font = '14px "DotGothic16", monospace';
    ctx.fillText("CLICK / TAP TO START", WIDTH / 2, HEIGHT / 2);

    ctx.textAlign = "left";
  }

  /*
   * ゲーム状態の更新
   */
  function update() {
    const now = performance.now();

    if (confirmingClearData || needsStartGesture) {
      lastFrameTime = now;
      return;
    }

    if (countdownPhase !== null) {
      updateCountdown(now);
      lastFrameTime = now;
      return;
    }

    if (gameOver || paused) {
      lastFrameTime = now;
      return;
    }

    const deltaMs = Math.min(now - lastFrameTime, 100);
    lastFrameTime = now;
    runTimeMs += deltaMs;

    if (invincibleRemainingMs > 0) {
      invincibleRemainingMs = Math.max(
        0,
        invincibleRemainingMs - deltaMs
      );
    }

    if (invincibleRemainingMs2 > 0) {
      invincibleRemainingMs2 = Math.max(
        0,
        invincibleRemainingMs2 - deltaMs
      );
    }

    if (damageIframeMs > 0) {
      damageIframeMs = Math.max(0, damageIframeMs - deltaMs);
    }

    if (damageIframeMs2 > 0) {
      damageIframeMs2 = Math.max(0, damageIframeMs2 - deltaMs);
    }

    if (
      twoPlayerMode &&
      twoPlayerRule === "coop" &&
      reviveRemainingMs2 > 0
    ) {
      reviveRemainingMs2 = Math.max(0, reviveRemainingMs2 - deltaMs);

      if (reviveRemainingMs2 <= 0) {
        hitPoints2 = maxHitPoints();
        damageIframeMs2 = HIT_IFRAME_MS;
        playSound("healGet");
      }
    }

    if (invincibleItem.active) {
      invincibleItem.remainingMs -= deltaMs;

      if (invincibleItem.remainingMs <= 0) {
        invincibleItem.active = false;
        invincibleItem.remainingMs = 0;
      }
    }

    if (healItem.active) {
      healItem.remainingMs -= deltaMs;

      if (healItem.remainingMs <= 0) {
        healItem.active = false;
        healItem.remainingMs = 0;
      }
    }

    updatePlayers();
    updateEnemies();
    checkGameCollisions();
  }

  /*
   * 描画
   */
  function draw() {
    drawBackground();
    drawCoin();
    drawInvincibleItem();
    drawHealItem();
    drawEnemies();
    drawPlayers();
    drawScore();

    if (gameOver) {
      drawGameOver();
    }

    if (paused && !confirmingClearData && countdownPhase === null) {
      drawPause();
    }

    if (needsStartGesture) {
      drawClickToStart();
    } else if (countdownPhase !== null) {
      drawCountdown();
    }

    if (confirmingClearData) {
      drawClearDataConfirm();
    }
  }

  /*
   * メインループ
   */
  function gameLoop() {
    update();
    draw();
    syncBgm();

    animationId = requestAnimationFrame(gameLoop);
  }

  /*
   * 最初からやり直す
   */
  function restartGame() {
    score = 0;
    score2 = 0;
    highScoreAtStart = highScore;
    gameOver = false;
    historyRecorded = false;
    confirmingClearData = false;
    paused = false;
    invincibleRemainingMs = 0;
    invincibleRemainingMs2 = 0;
    damageIframeMs = 0;
    damageIframeMs2 = 0;
    resetHitPoints();
    invincibleItem.active = false;
    invincibleItem.remainingMs = 0;
    healItem.active = false;
    healItem.remainingMs = 0;
    starCooldownCoins = 0;
    healCooldownCoins = 0;
    runTimeMs = 0;
    runStartedAt = Date.now();
    runEndedAt = 0;
    lastFrameTime = performance.now();

    player.x = 40;
    player.y = 120;
    player.vx = 0;
    player.vy = 0;

    player2.x = 264;
    player2.y = 120;
    player2.vx = 0;
    player2.vy = 0;

    enemies = [];

    createEnemy();
    moveCoin();
    clearMovementKeys();

    if (needsStartGesture) {
      countdownPhase = null;
    } else {
      beginCountdown();
    }

    updatePlayingUi();
  }

  /*
   * 保存データを削除
   */
  function executeClearSavedData() {
    localStorage.removeItem(HIGH_SCORE_KEY);
    localStorage.removeItem(HIGH_SCORE_2P_KEY);
    localStorage.removeItem(TOTAL_COINS_KEY);
    highScore1P = 0;
    highScore2P = 0;
    highScore = 0;
    highScoreAtStart = 0;
    totalCoins = 0;
    score = 0;
    score2 = 0;
    confirmingClearData = false;

    if (loggedInUsername) {
      apiRequest("score.php", { method: "DELETE" })
        .then((data) => {
          if (!data.ok) {
            setAccountStatus(data.error || "削除に失敗しました", "error");
            return;
          }

          setAccountStatus("アカウントのハイスコアを削除しました", "ok");
          fetchWorldRanking();
        })
        .catch(() => {
          setAccountStatus("サーバーに接続できませんでした", "error");
        });
    }

    restartGame();
  }

  /*
   * アカウント / ハイスコア同期
   */
  function setAccountStatus(message, type) {
    accountStatus.textContent = message;
    accountStatus.className = "account-status";

    if (type) {
      accountStatus.classList.add(type);
    }
  }

  function setAuthPanelOpen(open) {
    authPanelOpen = open;

    if (open) {
      authPanel.classList.add("open");
    } else {
      authPanel.classList.remove("open");
    }
  }

  function updateAccountView() {
    if (loggedInUsername) {
      accountToggleButton.style.display = "none";
      logoutButton.style.display = "inline-block";
      deleteAccountButton.style.display = "inline-block";
      historyPanel.classList.add("visible");
      setAuthPanelOpen(false);
      updateLoginTimeLabel();
    } else {
      accountToggleButton.style.display = "inline-block";
      logoutButton.style.display = "none";
      deleteAccountButton.style.display = "none";
      historyPanel.classList.remove("visible");
      loginAt = 0;
      updateLoginTimeLabel();
      playHistory = [];
      renderHistoryList();
    }
  }

  function renderHistoryList() {
    if (!loggedInUsername) {
      historyList.innerHTML =
        '<div class="history-empty">ログインすると履歴が残ります</div>';
      return;
    }

    if (!playHistory.length) {
      historyList.innerHTML =
        '<div class="history-empty">まだ履歴がありません</div>';
      return;
    }

    historyList.innerHTML = playHistory
      .map((entry) => {
        const modeLabel = entry.mode === "2p" ? "2P" : "1P";
        const diffLabel = difficultyLabel(entry.difficulty);
        const ruleLabel =
          entry.mode === "2p" ? `/${twoPlayerRuleLabel(entry.twoPlayerRule)}` : "";
        const duration = formatRunTime(entry.durationMs || 0);
        const clock = `${formatClockHm(entry.startedAt)}〜${formatClockHm(entry.endedAt)}`;
        let scores = "";

        if (entry.mode === "2p") {
          scores =
            `SC ${entry.score} / 2PSC ${entry.score2} / TOTALSC ${entry.totalScore} / ` +
            `HI2 ${entry.highScore}`;
        } else {
          scores = `SCORE ${entry.score} / HI ${entry.highScore}`;
        }

        return `
          <div class="history-item" data-id="${entry.id}">
            <div class="history-item-body">
              <div>[${modeLabel}/${diffLabel}${ruleLabel}] ${scores}</div>
              <div class="history-item-meta">時間 ${duration}　${clock}</div>
            </div>
            <button type="button" class="history-delete" data-id="${entry.id}" aria-label="削除">×</button>
          </div>
        `;
      })
      .join("");
  }

  async function loadPlayHistory() {
    if (!loggedInUsername) {
      playHistory = [];
      renderHistoryList();
      return;
    }

    try {
      const data = await apiRequest("history.php", { method: "GET" });

      if (!data.ok) {
        setAccountStatus(data.error || "履歴の取得に失敗しました", "error");
        return;
      }

      playHistory = Array.isArray(data.history) ? data.history : [];
      renderHistoryList();
    } catch (error) {
      setAccountStatus("履歴の取得に失敗しました", "error");
    }
  }

  async function recordPlayHistory() {
    if (!loggedInUsername || !historyEnabled || historyRecorded) {
      return;
    }

    historyRecorded = true;

    const payload = {
      mode: twoPlayerMode ? "2p" : "1p",
      difficulty,
      twoPlayerRule: twoPlayerMode ? twoPlayerRule : null,
      score,
      score2: twoPlayerMode ? score2 : 0,
      totalScore: twoPlayerMode ? score + score2 : score,
      highScore,
      durationMs: Math.floor(runTimeMs),
      startedAt: runStartedAt,
      endedAt: runEndedAt || Date.now()
    };

    try {
      const data = await apiRequest("history.php", {
        method: "POST",
        body: JSON.stringify(payload)
      });

      if (!data.ok) {
        historyRecorded = false;
        setAccountStatus(data.error || "履歴の保存に失敗しました", "error");
        return;
      }

      playHistory = Array.isArray(data.history) ? data.history : playHistory;
      renderHistoryList();
    } catch (error) {
      historyRecorded = false;
      setAccountStatus("履歴の保存に失敗しました", "error");
    }
  }

  async function deletePlayHistory(id) {
    if (!loggedInUsername || !id) {
      return;
    }

    try {
      const data = await apiRequest("history.php", {
        method: "DELETE",
        body: JSON.stringify({ id })
      });

      if (!data.ok) {
        setAccountStatus(data.error || "履歴の削除に失敗しました", "error");
        return;
      }

      playHistory = Array.isArray(data.history) ? data.history : [];
      renderHistoryList();
    } catch (error) {
      setAccountStatus("履歴の削除に失敗しました", "error");
    }
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderWorldRanking() {
    rankingTypeHighButton.classList.toggle("active", rankingType === "high");
    rankingTypeCoinsButton.classList.toggle("active", rankingType === "coins");
    rankingHighSubTabs.style.display = rankingType === "high" ? "flex" : "none";
    ranking1PButton.classList.toggle("active", rankingMode === "1p");
    ranking2PButton.classList.toggle("active", rankingMode === "2p");

    let rows = [];
    let emptyMessage = "まだランキングがありません";
    let scoreKey = "highScore";
    let scorePrefix = "HI";

    if (rankingType === "coins") {
      rows = worldRankingCoins;
      scoreKey = "totalCoins";
      scorePrefix = "COIN";
      emptyMessage = "まだコイン獲得数がありません";
    } else {
      rows = rankingMode === "2p" ? worldRanking2P : worldRanking1P;
    }

    if (!rows.length) {
      worldRankingList.innerHTML = `<div class="history-empty">${emptyMessage}</div>`;
      return;
    }

    worldRankingList.innerHTML = rows
      .map((entry, index) => {
        const isMe = loggedInUsername && entry.username === loggedInUsername;
        return `
          <div class="rank-item${isMe ? " me" : ""}">
            <span class="rank-pos">${index + 1}</span>
            <span class="rank-name">${escapeHtml(entry.username)}</span>
            <span class="rank-score">${scorePrefix} ${entry[scoreKey]}</span>
          </div>
        `;
      })
      .join("");
  }

  async function fetchWorldRanking() {
    try {
      const data = await apiRequest("ranking.php", { method: "GET" });

      if (!data.ok) {
        return;
      }

      worldRanking1P = Array.isArray(data.ranking1P) ? data.ranking1P : [];
      worldRanking2P = Array.isArray(data.ranking2P) ? data.ranking2P : [];
      worldRankingCoins = Array.isArray(data.rankingCoins)
        ? data.rankingCoins
        : [];
      worldRankingMeta.textContent = `自動更新中　${new Date().toLocaleTimeString("ja-JP")}`;
      renderWorldRanking();
    } catch (error) {
      // ignore transient network errors
    }
  }

  async function syncRankingPreference() {
    if (!loggedInUsername) {
      return;
    }

    try {
      const data = await apiRequest("score.php", {
        method: "POST",
        body: JSON.stringify({
          highScore: highScore1P,
          highScore2P: highScore2P,
          totalCoins,
          rankingEnabled
        })
      });

      if (data.ok && data.totalCoins !== undefined) {
        totalCoins = Math.max(totalCoins, Number(data.totalCoins) || 0);
        localStorage.setItem(TOTAL_COINS_KEY, String(totalCoins));
      }

      await fetchWorldRanking();
    } catch (error) {
      // ignore
    }
  }

  function syncTotalCoinsThrottled() {
    if (!loggedInUsername) {
      return;
    }

    const now = Date.now();

    if (now - lastTotalCoinsSyncAt < 2000) {
      return;
    }

    lastTotalCoinsSyncAt = now;

    apiRequest("score.php", {
      method: "POST",
      body: JSON.stringify({
        totalCoins,
        rankingEnabled
      })
    })
      .then((data) => {
        if (!data.ok) {
          return;
        }

        if (data.totalCoins !== undefined) {
          totalCoins = Math.max(totalCoins, Number(data.totalCoins) || 0);
          localStorage.setItem(TOTAL_COINS_KEY, String(totalCoins));
        }
      })
      .catch(() => {
        // ignore
      });
  }

  async function refreshOnlineBoards() {
    if (loggedInUsername) {
      await syncRankingPreference();
      return;
    }

    await fetchWorldRanking();
  }

  function startOnlinePolling() {
    if (onlinePollTimer) {
      return;
    }

    fetchWorldRanking();

    onlinePollTimer = window.setInterval(() => {
      fetchWorldRanking();
    }, 2000);
  }

  async function apiRequest(path, options = {}) {
    const { headers: customHeaders, ...rest } = options;

    const response = await fetch(`${API_BASE}/${path}`, {
      credentials: "same-origin",
      ...rest,
      headers: {
        "Content-Type": "application/json",
        ...(customHeaders || {})
      }
    });

    let data = null;

    try {
      data = await response.json();
    } catch (error) {
      data = {
        ok: false,
        error: "サーバー応答を読めませんでした"
      };
    }

    if (!response.ok && data && !data.error) {
      data.error = `エラー (${response.status})`;
    }

    return data;
  }

  function refreshHighScoreForMode() {
    highScore = twoPlayerMode ? highScore2P : highScore1P;
    highScoreAtStart = highScore;
  }

  function applyHighScores(score1P, score2P, resetStart = false, coins) {
    if (score1P !== undefined && score1P !== null) {
      highScore1P = Number(score1P) || 0;
      localStorage.setItem(HIGH_SCORE_KEY, String(highScore1P));
    }

    if (score2P !== undefined && score2P !== null) {
      highScore2P = Number(score2P) || 0;
      localStorage.setItem(HIGH_SCORE_2P_KEY, String(highScore2P));
    }

    if (coins !== undefined && coins !== null) {
      totalCoins = Math.max(totalCoins, Number(coins) || 0);
      localStorage.setItem(TOTAL_COINS_KEY, String(totalCoins));
    }

    highScore = twoPlayerMode ? highScore2P : highScore1P;

    if (resetStart || score === 0) {
      highScoreAtStart = highScore;
    }
  }

  async function syncHighScoreWithServer(preferred1P, preferred2P) {
    const local1P = Number(localStorage.getItem(HIGH_SCORE_KEY)) || 0;
    const local2P = Number(localStorage.getItem(HIGH_SCORE_2P_KEY)) || 0;
    const localCoins = Number(localStorage.getItem(TOTAL_COINS_KEY)) || 0;
    const candidate1P = Math.max(
      local1P,
      Number(preferred1P) || 0
    );
    const candidate2P = Math.max(
      local2P,
      Number(preferred2P) || 0
    );
    totalCoins = Math.max(totalCoins, localCoins);

    const data = await apiRequest("score.php", {
      method: "POST",
      body: JSON.stringify({
        highScore: candidate1P,
        highScore2P: candidate2P,
        totalCoins,
        rankingEnabled
      })
    });

    if (!data.ok) {
      throw new Error(data.error || "同期に失敗しました");
    }

    applyHighScores(data.highScore, data.highScore2P, true, data.totalCoins);
    return data;
  }

  function saveHighScore(value) {
    if (twoPlayerMode) {
      highScore2P = value;
      localStorage.setItem(HIGH_SCORE_2P_KEY, String(value));
    } else {
      highScore1P = value;
      localStorage.setItem(HIGH_SCORE_KEY, String(value));
    }

    highScore = value;

    if (!loggedInUsername) {
      return;
    }

    const payload = twoPlayerMode
      ? { highScore2P: value, totalCoins, rankingEnabled }
      : { highScore: value, totalCoins, rankingEnabled };

    apiRequest("score.php", {
      method: "POST",
      body: JSON.stringify(payload)
    })
      .then((data) => {
        if (!data.ok) {
          setAccountStatus(data.error || "同期に失敗しました", "error");
          return;
        }

        applyHighScores(data.highScore, data.highScore2P, false, data.totalCoins);
      })
      .catch(() => {
        setAccountStatus("ハイスコアの同期に失敗しました", "error");
      });
  }

  async function handleAuth(action) {
    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    if (!username || !password) {
      setAccountStatus("ユーザー名とパスワードを入力してください", "error");
      return;
    }

    setAccountStatus("通信中...");

    try {
      const data = await apiRequest(`auth.php?action=${action}`, {
        method: "POST",
        body: JSON.stringify({ username, password })
      });

      if (!data.ok) {
        setAccountStatus(data.error || "失敗しました", "error");
        return;
      }

      loggedInUsername = data.username;
      loginAt = Date.now();
      passwordInput.value = "";
      setAuthPanelOpen(false);

      await syncHighScoreWithServer(data.highScore, data.highScore2P);
      updateAccountView();
      await loadPlayHistory();
      await refreshOnlineBoards();
      setAccountStatus(
        action === "register"
          ? "アカウントを作成してログインしました"
          : "ログインしました",
        "ok"
      );
    } catch (error) {
      setAccountStatus(
        error.message || "サーバーに接続できませんでした",
        "error"
      );
    }
  }

  async function handleLogout() {
    setAccountStatus("通信中...");

    try {
      const data = await apiRequest("auth.php?action=logout", {
        method: "POST",
        body: "{}"
      });

      if (!data.ok) {
        setAccountStatus(data.error || "ログアウトに失敗しました", "error");
        return;
      }

      loggedInUsername = null;
      playHistory = [];
      updateAccountView();
      renderWorldRanking();
      fetchWorldRanking();
      setAccountStatus("ログアウトしました", "ok");
    } catch (error) {
      setAccountStatus("サーバーに接続できませんでした", "error");
    }
  }

  async function handleDeleteAccount() {
    if (!window.confirm("アカウントを削除しますか？ハイスコアも消えます。")) {
      return;
    }

    setAccountStatus("通信中...");

    try {
      const data = await apiRequest("auth.php?action=delete", {
        method: "POST",
        body: "{}"
      });

      if (!data.ok) {
        setAccountStatus(data.error || "アカウント削除に失敗しました", "error");
        return;
      }

      loggedInUsername = null;
      localStorage.removeItem(HIGH_SCORE_KEY);
      localStorage.removeItem(HIGH_SCORE_2P_KEY);
      localStorage.removeItem(TOTAL_COINS_KEY);
      highScore1P = 0;
      highScore2P = 0;
      highScore = 0;
      highScoreAtStart = 0;
      totalCoins = 0;
      score = 0;
      score2 = 0;
      updateAccountView();
      renderWorldRanking();
      fetchWorldRanking();
      setAccountStatus("アカウントを削除しました", "ok");
      restartGame();
    } catch (error) {
      setAccountStatus("サーバーに接続できませんでした", "error");
    }
  }

  async function restoreAccountSession() {
    updateAccountView();

    try {
      const data = await apiRequest("auth.php?action=me", {
        method: "GET"
      });

      if (!data.ok || !data.loggedIn) {
        loggedInUsername = null;
        updateAccountView();
        return;
      }

      loggedInUsername = data.username;
      loginAt = Date.now();
      await syncHighScoreWithServer(data.highScore, data.highScore2P);
      updateAccountView();
      await loadPlayHistory();
      await refreshOnlineBoards();
      setAccountStatus("アカウントのハイスコアを読み込みました", "ok");
    } catch (error) {
      loggedInUsername = null;
      loginAt = 0;
      updateAccountView();
    }
  }

  historyList.addEventListener("click", (event) => {
    const button = event.target.closest(".history-delete");

    if (!button) {
      return;
    }

    deletePlayHistory(button.getAttribute("data-id"));
  });

  rankingTypeHighButton.addEventListener("click", () => {
    rankingType = "high";
    renderWorldRanking();
  });

  rankingTypeCoinsButton.addEventListener("click", () => {
    rankingType = "coins";
    renderWorldRanking();
  });

  ranking1PButton.addEventListener("click", () => {
    rankingMode = "1p";
    renderWorldRanking();
  });

  ranking2PButton.addEventListener("click", () => {
    rankingMode = "2p";
    renderWorldRanking();
  });

  timeFormat24Button.addEventListener("click", () => {
    timeFormat = "24";
    saveTimeSettings();
  });

  timeFormat12Button.addEventListener("click", () => {
    timeFormat = "12";
    saveTimeSettings();
  });

  difficultyEasyButton.addEventListener("click", () => {
    setDifficulty("easy");
  });

  difficultyNormalButton.addEventListener("click", () => {
    setDifficulty("normal");
  });

  difficultyHardButton.addEventListener("click", () => {
    setDifficulty("hard");
  });

  modeCoopButton.addEventListener("click", () => {
    setTwoPlayerRule("coop");
  });

  modeVersusButton.addEventListener("click", () => {
    setTwoPlayerRule("versus");
  });

  modeVersus2Button.addEventListener("click", () => {
    setTwoPlayerRule("versus2");
  });

  modeHardCoopButton.addEventListener("click", () => {
    setTwoPlayerRule("hardcoop");
  });

  ampmOnButton.addEventListener("click", () => {
    showAmPm = true;
    saveTimeSettings();
  });

  ampmOffButton.addEventListener("click", () => {
    showAmPm = false;
    saveTimeSettings();
  });

  soundOnButton.addEventListener("click", () => {
    soundEnabled = true;
    saveTimeSettings();
    unlockAudio().then((ctxAudio) => {
      if (ctxAudio && ctxAudio.state === "running") {
        emitSound("coin");
      }
    });
  });

  soundOffButton.addEventListener("click", () => {
    soundEnabled = false;
    saveTimeSettings();
  });

  bgmOnButton.addEventListener("click", () => {
    bgmEnabled = true;
    saveTimeSettings();
    unlockAudio();
  });

  bgmOffButton.addEventListener("click", () => {
    bgmEnabled = false;
    stopBgm();
    saveTimeSettings();
  });

  historyOnButton.addEventListener("click", () => {
    historyEnabled = true;
    saveTimeSettings();
  });

  historyOffButton.addEventListener("click", () => {
    historyEnabled = false;
    saveTimeSettings();
  });

  rankingOnButton.addEventListener("click", () => {
    rankingEnabled = true;
    saveTimeSettings();
    syncRankingPreference();
  });

  rankingOffButton.addEventListener("click", () => {
    rankingEnabled = false;
    saveTimeSettings();
    syncRankingPreference();
  });

  accountToggleButton.addEventListener("click", () => {
    setAuthPanelOpen(!authPanelOpen);

    if (authPanelOpen) {
      usernameInput.focus();
    }
  });

  loginSubmitButton.addEventListener("click", () => {
    handleAuth("login");
  });

  registerButton.addEventListener("click", () => {
    handleAuth("register");
  });

  logoutButton.addEventListener("click", handleLogout);
  deleteAccountButton.addEventListener("click", handleDeleteAccount);

  passwordInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      handleAuth("login");
    }
  });

  /*
   * ゲーム開始
   */
  function startGame() {
    updateSettingsView();
    restartGame();
    gameLoop();
    restoreAccountSession();
    startOnlinePolling();
  }

  if (document.fonts && document.fonts.load) {
    document.fonts
      .load('16px "DotGothic16"')
      .catch(() => null)
      .finally(startGame);
  } else {
    startGame();
  }
</script>
